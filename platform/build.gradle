plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ai.riviera'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springModulithVersion', "2.1.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Server-side session persistence (issue #109, design D-1): sessions live in Postgres so a
	// restart/redeploy keeps operators signed in. Schema is Flyway-owned (V19), never auto-initialized.
	// Boot 4 starter (not bare spring-session-jdbc): the session auto-configuration lives in the
	// split-out spring-boot-session-jdbc module the starter brings.
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	// Real SMTP transport for the edge Mailer port (#368, ADR-0011): JavaMailSender over the
	// configured relay (Scaleway TEM in deployment). Config lives in application-mailer.properties;
	// the default profile keeps the recording MockMailer and never creates a mail session.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.modulith:spring-modulith-observability-api'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
	// TargetEventPublication, so #405's mail re-drive can scope by listener (RegistryMailOutbox).
	implementation 'org.springframework.modulith:spring-modulith-events-core'
	// Stripe collection only (PaymentIntents + webhook signature verification) — NO Connect
	// (ADR-0002 / invariant #8). Lives behind the payment module's outbound PaymentGateway.
	implementation 'com.stripe:stripe-java:33.2.0'
	// Venue photo pipeline (#142): TwelveMonkeys ImageIO plugins (JPEG + WebP readers, auto-registered
	// via ServiceLoader) for robust decode of real-world uploads, and Thumbnailator for high-quality
	// resize + EXIF-orientation. Output is re-encoded JPEG, which drops all source metadata incl. GPS
	// EXIF (ADR-0008 / privacy). Behind the venue module's PhotoProcessor.
	implementation 'net.coobird:thumbnailator:0.4.21'
	implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.14.0'
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.14.0'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	// Prometheus scrape registry (#100 D4 observability). Runtime-only: Micrometer auto-detects it and
	// wires the /actuator/prometheus endpoint; no compile-time API is used. Version is BOM-managed.
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
	runtimeOnly 'org.springframework.modulith:spring-modulith-observability-core'
	runtimeOnly 'org.springframework.modulith:spring-modulith-runtime'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	// In-JVM SMTP sink for SmtpMailerIT (#368) — jakarta-mail 2.x line; no Docker needed.
	testImplementation 'com.icegreen:greenmail-junit5:2.1.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// The full suite holds ~30 cached Spring contexts in one worker; Gradle's 512m default OOMs.
	maxHeapSize = '1g'
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = false
	}
}
