# Local-dev SMTP: SPRING_PROFILES_ACTIVE=smtp4dev drives the REAL SmtpMailer against a local sink
# with zero env setup — every value has a local default. Sink: `platform/tools/smtp4dev/start
# smtp4dev.bat` (SMTP :2525, inbox http://localhost:3000); dummy credentials; STARTTLS off (plain
# SMTP). Never deployed: `prod,smtp4dev` aborts (MockMailerProdGuard).
spring.mail.host=${RIVIERA_SMTP_HOST:localhost}
spring.mail.port=${RIVIERA_SMTP_PORT:2525}
spring.mail.username=${RIVIERA_SMTP_USERNAME:username}
spring.mail.password=${RIVIERA_SMTP_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=${RIVIERA_SMTP_STARTTLS_REQUIRED:false}
# Finite transport timeouts (Jakarta Mail's defaults are infinite), from the same
# riviera.notification.mail.socket-timeout-ms knob as the mailer profile — never a local literal.
spring.mail.properties.mail.smtp.connectiontimeout=${riviera.notification.mail.socket-timeout-ms}
spring.mail.properties.mail.smtp.timeout=${riviera.notification.mail.socket-timeout-ms}
spring.mail.properties.mail.smtp.writetimeout=${riviera.notification.mail.socket-timeout-ms}

# Local-only From default; deployed, the mailer profile requires RIVIERA_MAIL_FROM.
riviera.mail.from=${RIVIERA_MAIL_FROM:service@rivierasunbeds.com}
