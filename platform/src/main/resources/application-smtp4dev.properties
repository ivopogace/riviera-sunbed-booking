# Local-dev SMTP profile (#368): drives the REAL SmtpMailer against a local smtp4dev sink with
# one flag - SPRING_PROFILES_ACTIVE=smtp4dev - and zero env setup. Unlike application-mailer.properties
# (the deployment posture: no-default placeholders, fail-at-boot, STARTTLS required), every value here
# HAS a local default on purpose: the sink is `platform/tools/smtp4dev/start smtp4dev.bat`
# (SMTP on :2525, inbox UI on http://localhost:3000), credentials are dummies the sink ignores, and
# STARTTLS is off because smtp4dev speaks plain SMTP. Never use this profile deployed - `prod,smtp4dev`
# still aborts via MockMailerProdGuard (`prod & !mailer`). Pinned by MailerProfileWiringTest.
spring.mail.host=${RIVIERA_SMTP_HOST:localhost}
spring.mail.port=${RIVIERA_SMTP_PORT:2525}
spring.mail.username=${RIVIERA_SMTP_USERNAME:username}
spring.mail.password=${RIVIERA_SMTP_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=${RIVIERA_SMTP_STARTTLS_REQUIRED:false}
# Finite transport timeouts, same rationale as the mailer profile (Jakarta Mail defaults are infinite).
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Local-only From default; the real address (noreply@<platform sending domain>) lands with #370.
riviera.mail.from=${RIVIERA_MAIL_FROM:service@rivierasunbeds.com}
