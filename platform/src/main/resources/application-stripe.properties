# Stripe collection (ADR-0002), loaded ONLY with the `stripe` profile; production runs `prod,stripe`.
# The empty defaults are rejected at boot by StripeConfig, naming the variable: an unresolved placeholder
# would bind as literal text and pass. Both are deploy-environment secrets — never in the repo, image or
# logs. Keep stripe.api-key / stripe.webhook-secret out of the default profile, where the stub gateway
# runs (StripeProfileWiringTest).
stripe.api-key=${STRIPE_API_KEY:}
# Verifies inbound webhook signatures (whsec_...).
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
