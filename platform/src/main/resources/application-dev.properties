# Origins allowed to call the API cross-origin: the :4200 dev server (and :8080 itself).
app.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200, http://localhost:8080}

# Local-only bootstrap operator login; deployed, RIVIERA_OPERATOR_PASSWORD supplies the password.
riviera.operator.username=operator
riviera.operator.password=local-dev-pw

spring.docker.compose.file=platform/compose.yaml

# Relative to the repository root, like the Compose file above: this profile runs from there.
riviera.map.dir=platform/map
