# Real SMTP transport (ADR-0011), loaded ONLY with the `mailer` profile; production runs
# `prod,mailer`. No defaults but the port: a missing variable aborts the boot, never the first send.
# Credentials are deploy-environment secrets — never in the repo, image or logs. Keep spring.mail.*
# out of the default profile, where MockMailer stands in (MailerProfileWiringTest). Scaleway TEM:
# smtp.tem.scw.cloud:587 (docs/runbooks/mailer-profile-smoke-test.md).
spring.mail.host=${RIVIERA_SMTP_HOST}
spring.mail.port=${RIVIERA_SMTP_PORT:587}
spring.mail.username=${RIVIERA_SMTP_USERNAME}
spring.mail.password=${RIVIERA_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
# STARTTLS is REQUIRED: relay credentials never cross a plaintext hop. The override is ONLY for
# local sinks without STARTTLS (smtp4dev, GreenMail); leave it unset deployed.
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${RIVIERA_SMTP_STARTTLS_REQUIRED:true}
# Finite transport timeouts: Jakarta Mail's defaults are INFINITE. All three read
# riviera.notification.mail.socket-timeout-ms, which also sets both mail pools' shutdown drain —
# retune that knob, never these lines.
spring.mail.properties.mail.smtp.connectiontimeout=${riviera.notification.mail.socket-timeout-ms}
spring.mail.properties.mail.smtp.timeout=${riviera.notification.mail.socket-timeout-ms}
spring.mail.properties.mail.smtp.writetimeout=${riviera.notification.mail.socket-timeout-ms}

# From address on every transactional mail (noreply@<platform sending domain>); required.
riviera.mail.from=${RIVIERA_MAIL_FROM}
