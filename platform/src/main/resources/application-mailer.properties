# Real SMTP transport (#368, ADR-0011) — loaded ONLY with the `mailer` profile; production runs
# `prod,mailer`. Placeholders deliberately have NO defaults (except the standard submission port):
# activating the profile without the environment set aborts at boot with an unresolved placeholder,
# never on first send. Keeping every spring.mail.* line out of the default profile also keeps the
# mail auto-configuration off there (MockMailer records instead; MailerProfileWiringTest pins both).
# Credentials come from deploy-environment secrets (the Stripe-key posture) — never repo/image/logs.
# Scaleway TEM values: host smtp.tem.scw.cloud, port 587 (docs/runbooks/mailer-profile-smoke-test.md).
spring.mail.host=${RIVIERA_SMTP_HOST}
spring.mail.port=${RIVIERA_SMTP_PORT:587}
spring.mail.username=${RIVIERA_SMTP_USERNAME}
spring.mail.password=${RIVIERA_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
# STARTTLS is REQUIRED by default — the relay credentials must never cross a plaintext hop. The
# override exists ONLY for local sinks without STARTTLS (smtp4dev/GreenMail); leave it unset deployed.
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${RIVIERA_SMTP_STARTTLS_REQUIRED:true}
# Finite transport timeouts (issue #368 AC) — the Jakarta Mail defaults are INFINITE, long enough for
# a degraded relay to pin the sending thread indefinitely. The shipped 10s comfortably exceeds a healthy
# 587 handshake. All three READ riviera.notification.mail.socket-timeout-ms (#410) rather than restating
# it: the same value is what both mail pools derive their shutdown drain window from, and while the two
# were separate literals they disagreed — 5s of drain against this 10s budget, so a redeploy stopped
# waiting on sends that were still legitimately running. Retune the knob, not these three lines.
spring.mail.properties.mail.smtp.connectiontimeout=${riviera.notification.mail.socket-timeout-ms}
spring.mail.properties.mail.smtp.timeout=${riviera.notification.mail.socket-timeout-ms}
spring.mail.properties.mail.smtp.writetimeout=${riviera.notification.mail.socket-timeout-ms}

# The From address on every transactional mail — noreply@<platform sending domain> once #370 lands.
riviera.mail.from=${RIVIERA_MAIL_FROM}
