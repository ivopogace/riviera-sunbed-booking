verification.subject=Bestätigen Sie Ihre E-Mail-Adresse
verification.body=Bestätigen Sie Ihre E-Mail-Adresse, indem Sie diesen Link öffnen:\n\n{0}\n\nWenn Sie kein Konto angelegt haben, können Sie diese Nachricht ignorieren.

operatorApproved.subject=Ihr Betreiberkonto ist freigegeben
operatorApproved.body=Ihr Betreiberkonto wurde freigegeben.\n\nIhre Beach Clubs sind jetzt online und für Gäste buchbar, und jeder Beach Club, den\nSie hinzufügen, geht online, sobald Sie ihn anlegen. Verwalten Sie sie jederzeit in der\nBetreiberkonsole:\n\n{0}

reset.subject=Passwort zurücksetzen
reset.body=Setzen Sie Ihr Passwort zurück, indem Sie diesen Link öffnen:\n\n{0}\n\nDer Link gilt einmal und nur für begrenzte Zeit. Wenn Sie kein Zurücksetzen angefordert haben, können Sie\ndiese Nachricht ignorieren – Ihr Passwort bleibt unverändert.

