disclosure.latePartial=Diese Buchung wurde nach Ablauf der kostenlosen Stornierungsfrist getätigt – bei einer Stornierung werden nur {0} % des Preises erstattet.
disclosure.lateNone=Diese Buchung wurde nach Ablauf der kostenlosen Stornierungsfrist getätigt – bei einer Stornierung erfolgt keine Erstattung.
disclosure.closed=Dies ist eine nicht erstattungsfähige Last-Minute-Buchung – sie kann nicht storniert werden.

