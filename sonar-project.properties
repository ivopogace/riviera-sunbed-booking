# SonarCloud — single project for the whole monorepo (backend + frontend + scripts).
sonar.projectKey=ivopogace_riviera-sunbed-booking
sonar.organization=swap-shop

# Production sources for both modules, plus `scripts/` — the merge gates' own machinery (the
# diff-scoped hygiene guards, the review-range check, their shared `git-diff.mjs` and
# `inline-template.mjs`, the CLI harness and the MCP launchers). A defect there never fails a
# build; it makes a gate report clean, so the one part of the tree whose defects are silent by
# construction is not left out of the one static read the PR gets. What "analysed" means for that
# directory, file by file:
#   - `scripts/*.mjs`         analysed as JavaScript (`.mjs` is in the default suffix list) and
#                             covered — see `sonar.javascript.lcov.reportPaths` below.
#   - `scripts/*.test.mjs`    the guard suites: excluded, the same treatment `**/*.spec.ts` gets.
#   - `scripts/*.sh`          analysed as shell (the IaC analyser's "Sonar way" shell profile), with
#                             no coverage measure: they add no lines to cover, so they never weigh on
#                             the new-code coverage bar.
sonar.sources=platform/src/main/java,frontend/src,scripts

# Backend (Java): compiled classes + JaCoCo XML (both downloaded as a CI artifact).
sonar.java.binaries=platform/build/classes/java/main
sonar.coverage.jacoco.xmlReportPaths=platform/build/reports/jacoco/test/jacocoTestReport.xml

# Frontend (TS/JS): Vitest lcov (downloaded as a CI artifact; SF paths are normalized
# to repo-root in CI so coverage maps under this single project).
# Scripts: the lcov Node's own test runner writes when the `sonar` job runs the guard suites with
# coverage (`node --test --experimental-test-coverage`, lcov reporter). It is produced in that job,
# not in the hygiene job, because the hygiene job runs on pull requests only and the scan must
# also read it on a push to `main`. Its SF paths are already repo-root-relative — no normalization.
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info,scripts/coverage/lcov.info

sonar.exclusions=**/*.spec.ts,**/*.test.mjs,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# The Vitest harness entry carries no coverage by construction: Vitest excludes `setupFiles` from
# its own coverage report, so the file is in `sonar.sources` with no lcov record and would be read
# as 0% covered. Analysis (issues, smells) still applies — only the coverage metric is waived.
sonar.coverage.exclusions=frontend/src/test-setup.ts

# Suppress java:S4032 ("remove this package") on package-info.java: these are the
# intentional Spring Modulith module markers (CLAUDE.md invariant #11). They hold only
# package-info.java until each module's aggregates land — deleting them would break the
# module structure and ApplicationModules.verify(). The smell clears itself as code lands.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S4032
sonar.issue.ignore.multicriteria.e1.resourceKey=**/package-info.java

# Suppress java:S1075 ("get this URI from a customizable parameter") on the two app-level
# security/web classes. EVERY URI-shaped constant these files hold is an HTTP ROUTE PATTERN
# matched by Spring Security / AntPathMatcher (SecurityConfig's ~13 "/api/..." path constants;
# RateLimitFilter's CREATE/VIEW/CANCEL/LOGIN paths) — part of the API contract, NOT filesystem
# URIs meant to be externally configurable (issue #157). Parameterising them would be wrong. The
# file scope is deliberate and correct, not overly broad: by their nature (HTTP security config +
# rate-limit filter) these classes never hold a filesystem/external URI, so S1075 is a false
# positive for every constant they carry — a per-constant @SuppressWarnings would only silence the
# same false positives while needing re-adding as route patterns are added. S1075 stays active in
# every OTHER file. The duplicated LOGIN_PATH is a deliberate mirror, documented in-code.
#
# S4 (#112) adds three more edge classes of the SAME nature — SSO redirect/callback machinery whose
# every URI-shaped constant is an HTTP ROUTE PATH used to build/match the /api/auth/sso/** endpoints
# (SsoController's callback template + the SPA post-login path; MockSsoGateway's mock-IdP path;
# MockSsoIdpController's callback template). They mirror the @GetMapping/SecurityConfig routes and are
# not externally-configurable filesystem URIs — same false positive, same deliberate file scope.
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1075
sonar.issue.ignore.multicriteria.e2.resourceKey=**/RateLimitFilter.java
sonar.issue.ignore.multicriteria.e3.ruleKey=java:S1075
sonar.issue.ignore.multicriteria.e3.resourceKey=**/SecurityConfig.java
sonar.issue.ignore.multicriteria.e4.ruleKey=java:S1075
sonar.issue.ignore.multicriteria.e4.resourceKey=**/SsoController.java
sonar.issue.ignore.multicriteria.e5.ruleKey=java:S1075
sonar.issue.ignore.multicriteria.e5.resourceKey=**/MockSsoGateway.java
sonar.issue.ignore.multicriteria.e6.ruleKey=java:S1075
sonar.issue.ignore.multicriteria.e6.resourceKey=**/MockSsoIdpController.java

# Suppress javascript:S4036 ("make sure the PATH used to find this command includes only what you
# intend") on the three developer-tooling scripts that spawn a bare `git` or `npx`. Consulting
# PATH there is the design, not an oversight, and the rule's remedy — an absolute path — would
# break what each script exists to do:
#   - `playwright-mcp.mjs` spawns `npx` under the session's toolchain. In a cloud session that is
#     the Node 26 the setup script pins by symlinking node/npm/npx into `$HOME/.local/bin`, placed
#     first on PATH so it shadows the image's baked-in Node (docs/agents/cloud-environment.md). An
#     absolute path either bypasses that pin or hardcodes a user-home directory; on Windows the
#     command is a `.cmd` shim that only a PATH lookup finds.
#   - `git-diff.mjs` and `guard-cli-harness.mjs` spawn `git` for the diff-scoped hygiene guards
#     and their suites, which run on contributor laptops (Windows, macOS, Linux) and on CI runners
#     whose git lives wherever the host put it. There is no one path to pin.
# The threat the rule guards (CWE-426/427: a planted binary in a writable PATH entry) needs an
# attacker who already writes the developer's own PATH, and `scripts/` never ships in the deploy
# image (platform/Dockerfile copies frontend/ and platform/ only). The file scope is as tight as
# the finding: each of the three holds exactly one bare spawn (the harness's other spawn runs
# `process.execPath`, an absolute path), so nothing unrelated hides behind it. S4036 stays active
# for every other file, so a new bare spawn elsewhere gets its own look.
sonar.issue.ignore.multicriteria.e7.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e7.resourceKey=**/playwright-mcp.mjs
sonar.issue.ignore.multicriteria.e8.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e8.resourceKey=**/git-diff.mjs
sonar.issue.ignore.multicriteria.e9.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e9.resourceKey=**/guard-cli-harness.mjs
