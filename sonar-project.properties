# SonarCloud — single project for the whole monorepo (backend + frontend).
sonar.projectKey=ivopogace_riviera-sunbed-booking
sonar.organization=swap-shop

# Production sources for both modules.
sonar.sources=platform/src/main/java,frontend/src

# Backend (Java): compiled classes + JaCoCo XML (both downloaded as a CI artifact).
sonar.java.binaries=platform/build/classes/java/main
sonar.coverage.jacoco.xmlReportPaths=platform/build/reports/jacoco/test/jacocoTestReport.xml

# Frontend (TS/JS): Vitest lcov (downloaded as a CI artifact; SF paths are normalized
# to repo-root in CI so coverage maps under this single project).
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# The Vitest harness entry carries no coverage by construction: Vitest excludes `setupFiles` from
# its own coverage report, so the file is in `sonar.sources` with no lcov record and would be read
# as 0% covered. Analysis (issues, smells) still applies — only the coverage metric is waived.
sonar.coverage.exclusions=frontend/src/test-setup.ts

# Suppress java:S4032 ("remove this package") on package-info.java: these are the
# intentional Spring Modulith module markers (CLAUDE.md invariant #11). They hold only
# package-info.java until each module's aggregates land — deleting them would break the
# module structure and ApplicationModules.verify(). The smell clears itself as code lands.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S4032
sonar.issue.ignore.multicriteria.e1.resourceKey=**/package-info.java

# Suppress java:S1075 ("get this URI from a customizable parameter") on the two app-level
# security/web classes. EVERY URI-shaped constant these files hold is an HTTP ROUTE PATTERN
# matched by Spring Security / AntPathMatcher (SecurityConfig's ~13 "/api/..." path constants;
# RateLimitFilter's CREATE/VIEW/CANCEL/LOGIN paths) — part of the API contract, NOT filesystem
# URIs meant to be externally configurable (issue #157). Parameterising them would be wrong. The
# file scope is deliberate and correct, not overly broad: by their nature (HTTP security config +
# rate-limit filter) these classes never hold a filesystem/external URI, so S1075 is a false
# positive for every constant they carry — a per-constant @SuppressWarnings would only silence the
# same false positives while needing re-adding as route patterns are added. S1075 stays active in
# every OTHER file. The duplicated LOGIN_PATH is a deliberate mirror, documented in-code.
#
# S4 (#112) adds three more edge classes of the SAME nature — SSO redirect/callback machinery whose
# every URI-shaped constant is an HTTP ROUTE PATH used to build/match the /api/auth/sso/** endpoints
# (SsoController's callback template + the SPA post-login path; MockSsoGateway's mock-IdP path;
# MockSsoIdpController's callback template). They mirror the @GetMapping/SecurityConfig routes and are
# not externally-configurable filesystem URIs — same false positive, same deliberate file scope.
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S1075
sonar.issue.ignore.multicriteria.e2.resourceKey=**/RateLimitFilter.java
sonar.issue.ignore.multicriteria.e3.ruleKey=java:S1075
sonar.issue.ignore.multicriteria.e3.resourceKey=**/SecurityConfig.java
sonar.issue.ignore.multicriteria.e4.ruleKey=java:S1075
sonar.issue.ignore.multicriteria.e4.resourceKey=**/SsoController.java
sonar.issue.ignore.multicriteria.e5.ruleKey=java:S1075
sonar.issue.ignore.multicriteria.e5.resourceKey=**/MockSsoGateway.java
sonar.issue.ignore.multicriteria.e6.ruleKey=java:S1075
sonar.issue.ignore.multicriteria.e6.resourceKey=**/MockSsoIdpController.java
