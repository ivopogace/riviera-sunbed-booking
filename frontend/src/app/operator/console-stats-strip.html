<section class="oc-stats" aria-label="Today at your venue" data-testid="oc-stats">
  <div
    class="mx-auto grid w-full max-w-[1100px] grid-cols-2 gap-2.5 px-5 py-3.5 sm:grid-cols-4"
  >
    <app-stat-tile label="Free today" valueTestId="oc-stat-free">
      {{ free() }}<span class="text-[14px] font-semibold text-(--riv-card-ink-faint)">
        / {{ total() }}</span
      >
    </app-stat-tile>

    <app-stat-tile label="Booked online" valueTestId="oc-stat-booked">
      {{ bookedOnline() ?? '—' }}
    </app-stat-tile>

    <app-stat-tile label="Walk-ins marked" valueTestId="oc-stat-walkins">
      {{ walkIns() ?? '—' }}
    </app-stat-tile>

    <app-stat-tile
      label="Online takings · today"
      valueTestId="oc-stat-takings"
      [sub]="netCaption()"
      subTestId="oc-stat-net"
    >
      @if (takings(); as t) {
        {{ money(t.gross) }}
      } @else {
        —
      }
    </app-stat-tile>
  </div>
</section>
