<!doctype html>
<!--
  PROTOTYPE — throwaway, never merged (#1762). Question: on a 390px phone, how should the tourist
  beach map show the WHOLE beach and still let them pick a set on a ≥44px target?
  Answer kept here: the ROW LENS. Every row is a ≥44px-tall button drawn at overview scale; the
  tapped row opens inline to 44px tiles while the rest of the beach stays in view. The two rejected
  variants (overview → zoom, mini-map) are in this file's history at 4f53c65.
  Open the file directly in a browser. ?theme=porcelain|riviera|dark (floating bar, or ←/→),
  ?lens=<row>|none for the open row, ?sel=<code> for the pick, ?shot=1 hides the bar.
  One vocabulary at both scales: tint + edge = free, strike = taken, SOLID = your pick only; partly
  free is a half tint in the row's own hue. The open row's head is its band and carries the row
  letter, so a 7-wide row fits at 44px with no pan. Rows in a shared band show their own free
  count in the empty columns. The open row follows the pick, else the first row with a free set.
  Fixture: Miramar (frontend/e2e/support/miramar-map.ts): row A 13 wide, B–I 7, five price zones,
  taken where (position + row) % 5 === 0; partly-free and walk-in sets added for the prototype.
  Colours are copied from src/tailwind.css's theme tokens.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PROTOTYPE #1762 phone map</title>
    <style>
      :root,
      [data-theme='porcelain'] {
        --bg:
          radial-gradient(110% 70% at 8% 2%, #ffffff 0%, rgba(255, 255, 255, 0) 54%),
          radial-gradient(130% 120% at 80% 106%, #cfeaf2 0%, rgba(207, 234, 242, 0) 60%),
          linear-gradient(165deg, #fbfdfe 0%, #eef5f7 50%, #dfeef2 100%);
        --ink: #0a2a33;
        --ink-soft: rgba(12, 42, 51, 0.7);
        --card-glass: rgba(255, 255, 255, 0.55);
        --card-ink: #0a2a33;
        --card-ink-soft: rgba(12, 42, 51, 0.78);
        --accent-ink: #085a6e;
        --head-fill: #0a4f5e;
        --head-ink: #ffffff;
        --sea: #cfeef6;
        --mid: #e7f5f1;
        --sand: #f6eedb;
        --chip-fill: rgba(255, 255, 255, 0.8);
        --chip-border: #cfe3df;
        --rail-ink: #0a4f5e;
        --frame: rgba(12, 42, 51, 0.25);
        --av-fill: rgba(255, 255, 255, 0.75);
        --av-border: #bfe3df;
        --av-ink: #0f7d8c;
        --pr-fill: rgba(251, 241, 217, 0.85);
        --pr-border: #e6c483;
        --pr-ink: #875911;
        --tk-fill: rgba(255, 255, 255, 0.2);
        --tk-border: #6b7d77;
        --tk-ink: #566560;
        --av-tint: rgba(15, 125, 140, 0.18);
        --pr-tint: rgba(135, 89, 17, 0.16);
        --wk-fill: rgba(239, 224, 189, 0.6);
        --wk-hatch: rgba(95, 77, 42, 0.16);
        --wk-border: #c8ab62;
        --wk-ink: #5f4d2a;
        --focus: #0f7d8c;
        --sel-fill: #0f7d8c;
        --sel-ink: #ffffff;
        --bar-fill: #ffffff;
      }
      [data-theme='riviera'] {
        --bg:
          radial-gradient(110% 70% at 8% 2%, #93e6f2 0%, rgba(147, 230, 242, 0) 52%),
          radial-gradient(100% 80% at 94% 0%, #ffe2b0 0%, rgba(255, 226, 176, 0) 44%),
          radial-gradient(130% 120% at 80% 106%, #0a5e93 0%, rgba(10, 94, 147, 0) 58%),
          linear-gradient(165deg, #38b6d2 0%, #0f7f94 46%, #0a4f6e 100%);
        --ink: #ffffff;
        --ink-soft: rgba(255, 255, 255, 0.86);
        --card-glass: rgba(255, 255, 255, 0.78);
      }
      [data-theme='dark'] {
        --bg:
          radial-gradient(110% 70% at 8% 2%, #3b4a5f 0%, rgba(59, 74, 95, 0) 52%),
          radial-gradient(130% 120% at 80% 106%, #0b1120 0%, rgba(11, 17, 32, 0) 58%),
          linear-gradient(165deg, #33415a 0%, #1e293b 46%, #0f172a 100%);
        --ink: #ffffff;
        --ink-soft: rgba(255, 255, 255, 0.86);
        --card-glass: rgba(16, 26, 46, 0.86);
        --card-ink: #f2f7fa;
        --card-ink-soft: rgba(242, 247, 250, 0.78);
        --accent-ink: #7cd7e8;
        --head-fill: #12384a;
        --head-ink: #e6f4f8;
        --sea: #14303c;
        --mid: #1c2f33;
        --sand: #2b2a22;
        --chip-fill: rgba(255, 255, 255, 0.12);
        --chip-border: rgba(255, 255, 255, 0.25);
        --rail-ink: #9adde8;
        --frame: rgba(255, 255, 255, 0.22);
        --av-fill: rgba(255, 255, 255, 0.1);
        --av-border: rgba(143, 214, 226, 0.45);
        --av-ink: #8fd6e2;
        --pr-fill: rgba(230, 196, 131, 0.18);
        --pr-border: #c8ab62;
        --pr-ink: #ecd09a;
        --tk-fill: rgba(255, 255, 255, 0.05);
        --tk-border: #7d8f89;
        --tk-ink: #a7b5b0;
        --av-tint: rgba(143, 214, 226, 0.18);
        --pr-tint: rgba(236, 208, 154, 0.18);
        --wk-fill: rgba(239, 224, 189, 0.12);
        --wk-hatch: rgba(229, 211, 168, 0.14);
        --wk-border: #a08a50;
        --wk-ink: #e5d3a8;
        --focus: #8fd6e2;
        --sel-fill: #8fd6e2;
        --sel-ink: #0b1418;
        --bar-fill: #1c2740;
      }

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }
      .phone {
        width: 390px;
        margin: 0 auto;
        padding: 12px 12px 120px;
      }
      .venue-head {
        padding: 4px 4px 10px;
      }
      .venue-head h1 {
        font-size: 20px;
        margin: 0;
      }
      .venue-head p {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .card {
        border-radius: 22px;
        background: var(--card-glass);
        color: var(--card-ink);
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(7, 42, 58, 0.18);
      }
      .sea-head {
        background: var(--head-fill);
        color: var(--head-ink);
        text-align: center;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        padding: 10px;
      }
      .wash {
        background: linear-gradient(180deg, var(--sea) 0%, var(--mid) 55%, var(--sand) 100%);
        padding: 10px 12px 14px;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        font-size: 12px;
        color: var(--card-ink-soft);
        margin-bottom: 10px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .sw {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        display: inline-block;
      }
      .hint {
        font-size: 12px;
        color: var(--card-ink-soft);
        text-align: center;
        margin: 10px 0 0;
      }
      .band {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
        color: var(--rail-ink);
        background: var(--chip-fill);
        border: 1px solid var(--chip-border);
        border-radius: 999px;
        padding: 1px 8px;
        margin: 6px 0 2px;
      }
      .band em {
        font-style: normal;
        font-weight: 600;
        color: var(--card-ink-soft);
      }
      .chip {
        width: 24px;
        height: 24px;
        flex: none;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--rail-ink);
        background: var(--chip-fill);
        border: 1px solid var(--chip-border);
      }

      /* 44px pick tiles, as today */
      .tile {
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-size: 14px;
        font-weight: 700;
        border: 1.5px solid var(--av-border);
        background: var(--av-fill);
        color: var(--av-ink);
        cursor: pointer;
        padding: 0;
        font-family: inherit;
      }
      .tile.pr {
        border-color: var(--pr-border);
        background: var(--pr-fill);
        color: var(--pr-ink);
      }
      .tile.tk {
        border: 1.5px dashed var(--tk-border);
        background: var(--tk-fill);
        color: var(--tk-ink);
        cursor: default;
      }
      .tile.pt {
        border: 2px dotted var(--av-ink);
      }
      .tile.pr.pt:not(.sel) {
        border-color: var(--pr-ink);
      }
      .tile.wk {
        border-color: var(--wk-border);
        background:
          repeating-linear-gradient(135deg, var(--wk-hatch) 0 4px, transparent 4px 8px),
          var(--wk-fill);
        color: var(--wk-ink);
        cursor: default;
      }
      .tile.sel {
        background: var(--sel-fill);
        border-color: var(--sel-fill);
        border-style: solid;
        color: var(--sel-ink);
        position: relative;
      }
      .tile.sel::after {
        content: '✓';
        position: absolute;
        top: -7px;
        right: -5px;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-size: 11px;
        background: var(--sel-ink);
        color: var(--sel-fill);
        box-shadow: 0 0 0 1.5px var(--sel-fill);
      }
      .lens .chev {
        flex: none;
        width: 16px;
        text-align: center;
        font-size: 18px;
        line-height: 1;
        color: var(--accent-ink);
      }
      .closebtn {
        min-width: 44px;
        min-height: 44px;
        margin: -12px -8px -12px 0;
        border: 0;
        background: transparent;
        color: var(--accent-ink);
        font-size: 18px;
        cursor: pointer;
        border-radius: 12px;
      }
      .open {
        animation: lens-open 180ms ease-out;
      }
      @keyframes lens-open {
        from {
          opacity: 0.4;
          transform: scaleY(0.6);
          transform-origin: top;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .open {
          animation: none;
        }
      }
      .tile:focus-visible,
      .lens:focus-visible,
      .closebtn:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      .track {
        display: flex;
        gap: 3px;
      }
      .pan {
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-mask: linear-gradient(
          90deg,
          transparent 0,
          #000 16px,
          #000 calc(100% - 16px),
          transparent 100%
        );
        padding: 0 16px;
        margin: 0 -16px;
      }
      .pan::-webkit-scrollbar {
        display: none;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 3px 0;
      }

      /* overview cells: not pressable, state by fill vs ring (3:1 non-text contrast) */
      .ov {
        display: grid;
        grid-template-columns: repeat(13, 1fr);
        gap: 3px;
        flex: 1;
      }
      /* one vocabulary at both scales: tint + edge = free, strike = taken, SOLID = your pick only */
      .cell,
      .sw {
        --c: var(--av-ink);
        aspect-ratio: 1;
        border-radius: 4px;
        background: var(--av-tint);
        box-shadow: inset 0 0 0 1.5px var(--c);
      }
      .cell.pr,
      .sw.pr {
        --c: var(--pr-ink);
        background: var(--pr-tint);
      }
      .cell.pt,
      .sw.pt {
        background: linear-gradient(
          0deg,
          color-mix(in srgb, var(--c) 50%, transparent) 0 50%,
          transparent 50%
        );
      }
      .rowfree {
        align-self: center;
        text-align: right;
        font-size: 12px;
        font-weight: 600;
        color: var(--card-ink-soft);
        white-space: nowrap;
      }
      .cell.wk,
      .sw.wk {
        background: radial-gradient(circle, var(--wk-ink) 0 28%, transparent 30%);
        box-shadow: inset 0 0 0 1.5px var(--wk-ink);
        opacity: 0.9;
      }
      .cell.tk,
      .sw.tk {
        background: linear-gradient(
          135deg,
          transparent 0 44%,
          var(--tk-border) 44% 56%,
          transparent 56%
        );
        box-shadow: inset 0 0 0 1.5px var(--tk-border);
      }
      .legend .sw.sel {
        margin: 0 4px;
      }
      .cell.sel,
      .sw.sel {
        background: var(--sel-fill);
        box-shadow:
          0 0 0 2px var(--card-glass),
          0 0 0 4px var(--sel-fill);
      }
      .cell.hole {
        visibility: hidden;
      }

      /* C: row lens */
      .lens {
        width: 100%;
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 6px;
        background: transparent;
        border: 0;
        border-radius: 12px;
        padding: 0;
        margin: 0;
        cursor: pointer;
        font-family: inherit;
        color: inherit;
        text-align: left;
      }
      .lens:hover {
        background: rgba(127, 127, 127, 0.08);
      }
      .open {
        background: var(--chip-fill);
        border: 1px solid var(--chip-border);
        border-radius: 14px;
        padding: 8px 8px 8px;
        margin: 4px -4px;
      }
      .open-head {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--card-ink-soft);
        margin: 0 0 6px;
      }
      .open-head .band {
        margin: 0;
      }
      .open-head .closebtn {
        margin-left: auto;
      }
      .open .pan {
        flex: 1;
        padding: 9px 8px 0;
        margin: -9px -8px 0;
        -webkit-mask: linear-gradient(
          90deg,
          transparent 0,
          #000 3px,
          #000 calc(100% - 3px),
          transparent 100%
        );
      }

      .bookbar {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 64px;
        width: 366px;
        background: var(--bar-fill);
        color: var(--card-ink);
        border-radius: 18px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        box-shadow: 0 12px 30px rgba(7, 42, 58, 0.3);
        font-size: 14px;
      }
      .bookbar button {
        min-height: 44px;
        border-radius: 12px;
        border: 0;
        background: var(--sel-fill);
        color: var(--sel-ink);
        font: 700 14px inherit;
        font-family: inherit;
        padding: 0 16px;
      }

      .switcher {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 10px;
        z-index: 9;
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 6px;
        border-radius: 999px;
        background: #111;
        color: #fff;
        font: 600 12px system-ui;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      }
      .switcher button {
        background: #333;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 6px 10px;
        cursor: pointer;
        font: inherit;
      }
      .switcher button.on {
        background: #f5c542;
        color: #111;
      }
      body.shot .switcher {
        display: none;
      }
      body.shot .bookbar {
        bottom: 12px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="venue-head">
        <h1>Miramar Beach Club</h1>
        <p>Ksamil · Sat 20 Jun · <span id="freeTotal"></span></p>
      </div>
      <div class="card">
        <div class="sea-head">▲ FACING THE SEA</div>
        <div class="wash" id="wash"></div>
      </div>
    </div>
    <div class="bookbar" id="bookbar" hidden></div>
    <div class="switcher" id="switcher"></div>

    <script>
      // ---- fixture: Miramar, as frontend/e2e/support/miramar-map.ts ----
      const ROWS = {
        A: [4500, 4500, 4500, 4500, 4500, 4500, 3500, 3500, 3500, 3500, 3500, 3500, 3500],
        B: [3500, 3500, 3500, 3500, 3500, 3500, 2500],
        C: [3000, 3000, 3000, 3000, 3000, 3000, 2000],
        D: [2500, 2500, 2500, 2000, 2500, 2500, 2000],
        E: [2000, 2000, 2000, 2000, 2000, 2000, 2000],
        F: [2000, 2000, 2000, 2000, 2000, 2000, 2000],
        G: [2000, 2000, 2000, 2000, 2000, 2000, 2000],
        H: [2000, 2000, 2000, 2000, 2000, 2000, 2000],
        I: [2000, 2000, 2000, 2000, 2000, 2000, 2000],
      };
      const COLS = 13;
      const rows = Object.entries(ROWS).map(([label, prices], r) => ({
        label,
        sets: prices.map((minor, p) => ({
          code: label + (p + 1),
          pos: p + 1,
          minor,
          premium: label === 'A',
          state:
            (p + r) % 5 === 0
              ? 'taken'
              : label !== 'A' && p === 6 && r < 4
                ? 'walkin'
                : (p + r) % 7 === 3
                  ? 'partly'
                  : 'free',
          get taken() {
            return this.state === 'taken' || this.state === 'walkin';
          },
        })),
      }));
      const ZONES = [
        { name: 'Front row', rows: ['A'] },
        { name: 'Second row', rows: ['B'] },
        { name: 'Third row', rows: ['C'] },
        { name: 'Fourth row', rows: ['D'] },
        { name: 'Back rows', rows: ['E', 'F', 'G', 'H', 'I'] },
      ];
      const eur = (m) => '€' + m / 100;
      const span = (sets) => {
        const ps = sets.map((s) => s.minor);
        const lo = Math.min(...ps),
          hi = Math.max(...ps);
        return lo === hi ? eur(lo) : eur(lo) + '–' + eur(hi);
      };
      const rowsOf = (z) => rows.filter((r) => z.rows.includes(r.label));
      const freeIn = (rs) => rs.flatMap((r) => r.sets).filter((s) => !s.taken).length;
      const totalIn = (rs) => rs.flatMap((r) => r.sets).length;
      document.getElementById('freeTotal').textContent =
        freeIn(rows) + ' of ' + totalIn(rows) + ' sets free';

      // ---- state ----
      const qs = new URLSearchParams(location.search);
      const state = {
        theme: qs.get('theme') || 'porcelain',
        lens: qs.get('lens') || null, // open row label
        sel: qs.get('sel') || null,
      };
      if (qs.has('shot')) document.body.classList.add('shot');
      const defaultLens = () =>
        (
          rows.find((r) => r.sets.some((s) => s.code === state.sel)) ||
          rows.find((r) => r.sets.some((s) => !s.taken))
        ).label; // the pick's row, else the first row with a free set
      if (state.lens === 'none') state.lens = null;
      else if (state.lens === null) state.lens = defaultLens();

      // ---- pieces ----
      const zoneBand = (z) => {
        const rs = rowsOf(z);
        const sets = rs.flatMap((r) => r.sets);
        return `<div class="band" role="presentation">${span(sets)} <em>· ${freeIn(rs)} of ${totalIn(rs)} free</em></div>`;
      };
      const cls = (s) =>
        ({ taken: 'tk', walkin: 'wk' })[s.state] ||
        (s.premium ? 'pr ' : '') + (s.state === 'partly' ? 'pt' : '');
      const tile = (s) =>
        s.taken
          ? `<button class="tile ${cls(s)}" aria-label="${s.code}, ${s.state === 'walkin' ? 'walk-in only' : 'taken'}" aria-disabled="true">${s.pos}</button>`
          : `<button class="tile ${s.premium ? 'pr' : ''} ${s.state === 'partly' ? 'pt' : ''} ${state.sel === s.code ? 'sel' : ''}" data-sel="${s.code}" aria-label="${s.code}, ${eur(s.minor)}, ${s.state === 'partly' ? 'partly free' : 'free'}" aria-pressed="${state.sel === s.code}">${s.pos}</button>`;
      const cells = (r, note = '') => {
        let h = '';
        for (let c = 1; c <= COLS; c++) {
          const s = r.sets[c - 1];
          if (!s) {
            if (note && COLS - r.sets.length >= 3) {
              h += `<span class="rowfree" style="grid-column:${c} / -1">${note}</span>`;
              break;
            }
            h += '<i class="cell hole"></i>';
            continue;
          }
          h += `<i class="cell ${state.sel === s.code ? 'sel' : cls(s)}"></i>`;
        }
        return `<div class="ov" aria-hidden="true">${h}</div>`;
      };
      const legend = () =>
        `<div class="legend">
          <span><i class="sw"></i>Free</span>
          <span><i class="sw pr"></i>Front row</span>
          <span><i class="sw pt"></i>Partly free</span>
          <span><i class="sw wk"></i>Walk-in only</span>
          <span><i class="sw tk"></i>Taken</span>
          <span><i class="sw sel"></i>Your pick</span>
        </div>`;

      // ---- row lens ----
      function lensMap() {
        let h = legend();
        for (const z of ZONES) {
          const zr = rowsOf(z);
          const solo = zr.length === 1;
          if (!(solo && zr[0].label === state.lens)) h += zoneBand(z);
          for (const r of zr) {
            const free = r.sets.filter((s) => !s.taken).length;
            const count = `${free} of ${r.sets.length} free`;
            if (r.label === state.lens) {
              const own =
                span(r.sets) === span(zr.flatMap((x) => x.sets)) ? '' : span(r.sets) + ' · ';
              h += `<div class="open" id="open">
                  <div class="open-head"><span class="chip">${r.label}</span>${solo ? zoneBand(z) : `<span>${own}${count}</span>`}<button class="closebtn" data-lens="" aria-expanded="true" aria-label="Close row ${r.label}">⌃</button></div>
                  <div class="row"><div class="pan" id="pan"><div class="track">${r.sets.map(tile).join('')}</div></div></div>
                </div>`;
            } else {
              h += `<button class="lens" data-lens="${r.label}" aria-expanded="false" aria-label="Row ${r.label}, ${span(r.sets)}, ${count}">
                  <span class="chip">${r.label}</span>${cells(r, solo ? '' : free + ' free')}<span class="chev" aria-hidden="true">›</span>
                </button>`;
            }
          }
        }
        if (!state.lens) h += `<p class="hint">Tap a row to open it and pick a set.</p>`;
        return h;
      }

      // the open row starts at position 1, unless no free set shows there
      function startPan() {
        const pan = document.getElementById('pan');
        const first = pan && pan.querySelector('.tile:not([aria-disabled])');
        if (first && first.offsetLeft + first.offsetWidth > pan.scrollLeft + pan.clientWidth)
          pan.scrollLeft = first.offsetLeft - 8;
      }

      // ---- render + wiring ----
      let panFor;
      function render() {
        document.documentElement.dataset.theme = state.theme;
        const wash = document.getElementById('wash');
        wash.innerHTML = lensMap();
        const s = rows.flatMap((r) => r.sets).find((x) => x.code === state.sel);
        const bar = document.getElementById('bookbar');
        bar.hidden = !s;
        if (s)
          bar.innerHTML = `<span><b>Set ${s.code}</b> · ${eur(s.minor)} · full day</span><button>Book this set</button>`;
        if (panFor !== state.lens) startPan();
        panFor = state.lens;
        renderSwitcher();
        syncUrl();
      }
      function syncUrl() {
        const p = new URLSearchParams();
        p.set('theme', state.theme);
        p.set('lens', state.lens || 'none');
        if (state.sel) p.set('sel', state.sel);
        if (document.body.classList.contains('shot')) p.set('shot', '1');
        history.replaceState(null, '', '?' + p);
      }
      const THEMES = ['porcelain', 'riviera', 'dark'];
      function renderSwitcher() {
        document.getElementById('switcher').innerHTML = THEMES.map(
          (t) => `<button data-t="${t}" class="${t === state.theme ? 'on' : ''}">${t}</button>`,
        ).join('');
      }

      document.addEventListener('click', (e) => {
        const t = e.target.closest('button');
        if (!t) return;
        if (t.dataset.t) state.theme = t.dataset.t;
        else if (t.dataset.lens !== undefined) {
          const y = t.getBoundingClientRect().top;
          state.lens = t.dataset.lens || null;
          render();
          const open = document.getElementById('open');
          const anchor = open || document.querySelector(`[data-lens="${t.dataset.lens}"]`);
          if (open) {
            window.scrollBy(0, open.getBoundingClientRect().top - y);
            open.querySelector('.tile:not([aria-disabled])')?.focus({ preventScroll: true });
          } else if (anchor) anchor.focus({ preventScroll: true });
          return;
        } else if (t.dataset.sel) state.sel = state.sel === t.dataset.sel ? null : t.dataset.sel;
        else return;
        render();
      });
      document.addEventListener('keydown', (e) => {
        if (e.target.matches('input,textarea,[contenteditable]')) return;
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        const i = THEMES.indexOf(state.theme) + (e.key === 'ArrowRight' ? 1 : -1);
        state.theme = THEMES[(i + 3) % 3];
        render();
      });
      render();
    </script>
  </body>
</html>
