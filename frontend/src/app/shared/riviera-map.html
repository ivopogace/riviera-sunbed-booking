<!-- Visually hidden until focused: the first stop inside the region, so a keyboard user can leave
     before the engine's pan-and-zoom canvas takes the arrow keys. -->
<button
  type="button"
  appTouchTarget
  data-testid="map-skip"
  class="sr-only m-0 focus:not-sr-only focus:absolute focus:top-3 focus:left-3 focus:z-20 focus:inline-flex focus:items-center focus:rounded-full focus:border focus:border-riv-solid-btn-border focus:bg-riv-solid-btn-fill focus:px-[16px] focus:text-[14px] focus:font-semibold focus:text-riv-solid-btn-ink"
  (click)="skipMap()"
>
  Skip map
</button>

<!-- The engine owns the inner box from create() on and its stylesheet repositions it, so the wrapper holds the placement. -->
<div class="absolute inset-0">
  <div #canvasHost data-testid="riviera-map-canvas" class="size-full"></div>
</div>

@if (status() === 'unavailable') {
  <p
    data-testid="map-unavailable"
    class="absolute inset-x-4 top-1/2 z-10 -translate-y-1/2 rounded-[18px] border border-riv-solid-btn-border bg-riv-solid-btn-fill px-4 py-3 text-center text-[14px] leading-[1.5] text-riv-solid-btn-ink"
  >
    The map can’t be shown in this browser. Every venue is in the list.
  </p>
} @else {
  <!-- One column for every map control, so nothing has to be placed around the credit pill below. -->
  <div class="absolute top-3 right-3 z-10 flex max-w-[calc(100%-24px)] flex-col items-end gap-2">
    @if (nearMeShown()) {
      <button
        type="button"
        appTouchTarget
        data-testid="map-near-me"
        class="inline-flex touch-manipulation items-center rounded-full border border-riv-solid-btn-border bg-riv-solid-btn-fill px-[16px] text-[14px] font-semibold text-riv-solid-btn-ink shadow-[0_6px_18px_rgba(7,42,58,0.22)] hover:bg-riv-solid-btn-hover aria-disabled:opacity-60"
        [appBusy]="locating()"
        (click)="findMe()"
      >
        Near me
      </button>
    }
    <fieldset class="flex flex-col gap-2">
      <legend class="sr-only">Zoom</legend>
      <button
        type="button"
        appTouchTarget
        data-testid="map-zoom-in"
        aria-label="Zoom in"
        class="inline-flex size-11 touch-manipulation items-center justify-center rounded-full border border-riv-solid-btn-border bg-riv-solid-btn-fill text-[22px] leading-none font-semibold text-riv-solid-btn-ink shadow-[0_6px_18px_rgba(7,42,58,0.22)] hover:bg-riv-solid-btn-hover"
        (click)="zoomIn()"
      >
        <span aria-hidden="true">+</span>
      </button>
      <button
        type="button"
        appTouchTarget
        data-testid="map-zoom-out"
        aria-label="Zoom out"
        class="inline-flex size-11 touch-manipulation items-center justify-center rounded-full border border-riv-solid-btn-border bg-riv-solid-btn-fill text-[22px] leading-none font-semibold text-riv-solid-btn-ink shadow-[0_6px_18px_rgba(7,42,58,0.22)] hover:bg-riv-solid-btn-hover"
        (click)="zoomOut()"
      >
        <span aria-hidden="true">−</span>
      </button>
    </fieldset>
    @if (nearMeMessage(); as text) {
      <p
        role="alert"
        data-testid="map-near-me-message"
        class="rounded-[18px] border border-riv-solid-btn-border bg-riv-solid-btn-fill px-[12px] py-[6px] text-right text-[14px] leading-[1.45] text-riv-solid-btn-ink shadow-[0_6px_18px_rgba(7,42,58,0.22)]"
      >
        {{ text }}
      </p>
    }
  </div>
}

<!-- The tiles' licence credits (OpenMapTiles CC-BY, OSM ODbL) in every map state; 13 px radius: a full pill on one line, still rounded when it wraps. -->
<!-- It covers whatever sits under it, and stays that way: `pointer-events-none` would read a press on the pill as a press on the map, which places a pin in the operator console. -->
<p
  data-testid="map-attribution"
  class="absolute right-3 bottom-3 z-10 max-w-[calc(100%-24px)] rounded-[13px] border border-riv-solid-btn-border bg-riv-solid-btn-fill px-[10px] py-[4px] text-[12px] leading-[16px] text-riv-solid-btn-ink"
>
  ©
  <a
    class="underline"
    href="https://openmaptiles.org/"
    target="_blank"
    rel="noopener noreferrer"
    data-touch-exempt="a link inside a sentence (WCAG 2.5.5 inline exception)"
    >OpenMapTiles</a
  >
  ©
  <a
    class="underline"
    href="https://www.openstreetmap.org/copyright"
    target="_blank"
    rel="noopener noreferrer"
    data-touch-exempt="a link inside a sentence (WCAG 2.5.5 inline exception)"
    >OpenStreetMap</a
  >
  contributors
</p>

<span #mapEnd tabindex="-1" data-testid="map-end" class="sr-only">End of map</span>
