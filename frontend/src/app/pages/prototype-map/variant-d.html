<!-- Phone: the map is the page and the sheet rides over its lower part. From md: the sheet is a column beside it. -->
<section
  class="relative overflow-hidden max-sm:h-[calc(100dvh-var(--proto-top)-61px)] sm:h-[calc(100dvh-var(--proto-top))] md:grid md:grid-cols-[minmax(0,1fr)_400px] md:gap-3 md:p-3"
  aria-label="Discover, variant D"
  [attr.data-sheet]="sheet()"
>
  <div
    appProtoPane
    class="relative h-full min-h-0 max-md:absolute max-md:inset-0"
    [class]="sheet() === 'full' ? 'max-md:invisible' : ''"
  >
    <app-riviera-map
      class="h-full max-md:rounded-none!"
      [nearMe]="true"
      (mapClick)="select(null)"
    />
    <app-venue-pin-layer
      class="max-md:rounded-none!"
      [pins]="pins()"
      [map]="mapHandle()"
      [selected]="selected()"
      [maxZoom]="maxZoom"
      (chosen)="onPin($event)"
    />
    @if (selectedCard(); as card) {
      @if (previewOpen()) {
        <app-venue-preview-card
          class="absolute inset-x-3 z-[5] max-md:top-3 md:right-3 md:bottom-[58px] md:left-auto md:w-[400px]"
          [card]="card"
          [date]="date()"
          [stack]="crowdStack()"
          (closed)="select(null)"
          (stepped)="onPin($event)"
        />
      }
    }
  </div>

  <!-- The sheet. Phone: three heights, all reached by the handle at the thumb. Desktop: a column. -->
  <div
    appCardGlass
    class="z-[6] flex min-h-0 flex-col rounded-[22px] shadow-[0_-10px_40px_rgba(7,42,58,0.25)] backdrop-blur-[26px] backdrop-saturate-[1.7] max-md:absolute max-md:inset-x-0 max-md:bottom-0 max-md:rounded-b-none max-md:[transition:height_0.25s_ease] max-md:motion-reduce:transition-none md:h-full"
    [class]="
      sheet() === 'peek'
        ? 'max-md:h-[236px]'
        : sheet() === 'half'
          ? 'max-md:h-[58%]'
          : 'max-md:h-full max-md:rounded-none'
    "
    data-testid="sheet"
  >
    <button
      type="button"
      appTouchTarget
      class="flex w-full cursor-pointer items-center justify-center md:hidden"
      [attr.aria-label]="'Sheet: ' + sheet() + '. Press to change'"
      (click)="cycleSheet()"
    >
      <span
        class="block h-[5px] w-[44px] rounded-full bg-riv-card-ink-soft/50"
        aria-hidden="true"
      ></span>
    </button>
    <form
      class="flex items-center gap-2 px-3 pb-2 max-md:-mt-1 md:pt-3"
      (submit)="$event.preventDefault()"
    >
      <input
        appTouchTarget
        appFieldGlass
        type="date"
        aria-label="Day"
        class="min-w-0 flex-1 rounded-full px-[12px] text-[14px] font-semibold"
        [value]="date()"
        (change)="onDate($event)"
      />
      <select
        appTouchTarget
        appFieldGlass
        aria-label="Beach"
        class="min-w-0 flex-1 rounded-full px-[12px] text-[14px] font-semibold"
        [value]="beach()"
        (change)="onBeachFilter($event)"
      >
        <option value="">All beaches</option>
        @for (g of groups; track g.code) {
          <option [value]="g.code">{{ g.label }}</option>
        }
      </select>
      <span class="shrink-0 text-[13px] text-riv-card-ink-soft"
        ><strong class="text-[18px] font-bold text-riv-accent-ink">{{
          cards().length
        }}</strong></span
      >
    </form>

    @if (sheet() === 'peek') {
      <!-- Peek: one row per screen, snapping; the settled row is the selected pin. Desktop never peeks. -->
      <ul
        #carousel
        data-rail
        class="flex snap-x snap-mandatory gap-2 overflow-x-auto px-3 pb-3 scrollbar-none md:hidden"
        aria-label="Venues"
        (scroll)="onCarouselScroll()"
      >
        @for (card of cards(); track card.id) {
          <li class="w-[calc(100%-24px)] shrink-0 snap-center">
            <app-proto-venue-row
              [card]="card"
              [date]="date()"
              [selected]="isSelected(card)"
              (chosen)="onRow($event)"
            />
          </li>
        }
      </ul>
    }
    <ul
      data-rail
      class="flex min-h-0 flex-1 flex-col gap-2 overflow-y-auto px-3 pb-3 scrollbar-thin"
      [class]="sheet() === 'peek' ? 'max-md:hidden' : ''"
      aria-label="Venues, north to south"
    >
      @for (card of cards(); track card.id) {
        <li>
          <app-proto-venue-row
            [card]="card"
            [date]="date()"
            [selected]="isSelected(card)"
            (chosen)="onRow($event)"
          />
        </li>
      }
    </ul>
  </div>
</section>
