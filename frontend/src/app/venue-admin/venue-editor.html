<section class="editor">
  <h1>Create a venue</h1>

  <!-- No sign-in/session card: operatorSessionGuard gates the route (#277); session controls live in the shared operator header. -->
  @if (errorMessage(); as msg) {
    <p class="form-error" role="alert">{{ msg }}</p>
  }

  @if (operator.signedIn()) {
    @if (venueId() === undefined) {
      <!-- Create the venue -->
      <form class="card" (submit)="onCreateVenue(); $event.preventDefault()" novalidate>
        <h2>Venue details</h2>

        <label class="field">
          <span>Name</span>
          <input type="text" [formField]="venueForm.name" />
          @if (venueForm.name().touched() && venueForm.name().errors().length) {
            <span class="field-error">{{ venueForm.name().errors()[0].message }}</span>
          }
        </label>

        <label class="field">
          <span>Beach</span>
          <input type="text" [formField]="venueForm.beach" />
          @if (venueForm.beach().touched() && venueForm.beach().errors().length) {
            <span class="field-error">{{ venueForm.beach().errors()[0].message }}</span>
          }
        </label>

        <label class="field">
          <span>Region</span>
          <input type="text" [formField]="venueForm.region" />
          @if (venueForm.region().touched() && venueForm.region().errors().length) {
            <span class="field-error">{{ venueForm.region().errors()[0].message }}</span>
          }
        </label>

        <label class="field">
          <span>Description</span>
          <input type="text" [formField]="venueForm.description" />
        </label>

        <label class="field">
          <span>Booking mode</span>
          <select [formField]="venueForm.bookingMode">
            <option value="INSTANT">Instant Book</option>
            <option value="REQUEST">Request to Book</option>
          </select>
        </label>

        <label class="field">
          <span>Commission (basis points)</span>
          <input type="text" inputmode="numeric" [formField]="venueForm.commissionBps" />
          @if (venueForm.commissionBps().touched() && venueForm.commissionBps().errors().length) {
            <span class="field-error">{{ venueForm.commissionBps().errors()[0].message }}</span>
          }
        </label>

        <label class="field">
          <span>Payout currency (ISO 4217)</span>
          <input type="text" autocomplete="off" [formField]="venueForm.payoutCurrency" />
          @if (venueForm.payoutCurrency().touched() && venueForm.payoutCurrency().errors().length) {
            <span class="field-error">{{ venueForm.payoutCurrency().errors()[0].message }}</span>
          }
        </label>

        <label class="field">
          <span>Booking cutoff (Europe/Tirane)</span>
          <input type="time" [formField]="venueForm.bookingCutoff" />
        </label>

        <button
          type="submit"
          class="btn-primary"
          [disabled]="venueForm().invalid() || saving()"
        >
          {{ saving() ? 'Creating…' : 'Create venue' }}
        </button>
      </form>
    } @else {
      <!-- Created: hand the operator into the console to lay out the beach map, set pricing, and
           edit details/commodities — all now console tabs (O3/O4/O8). -->
      <output class="card created" data-testid="venue-created">
        Venue <strong>#{{ venueId() }}</strong> created. Continue to the console to lay out its
        beach map, set pricing, and edit its details.
        <a class="btn-primary" [routerLink]="['/operator', venueId()]" data-testid="venue-console-link">
          Open the console
        </a>
      </output>
    }
  }
</section>
