<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Riviera</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Pre-paint theme seed: same resolution order as core/theme.ts (drift pin: theme-boot.spec.ts).
      // ThemeService stays the runtime single writer; this only pre-paints non-default themes (no FOUC).
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem('riviera-theme');
        } catch {
          // blocked storage (private mode): fall through to the OS preference
        }
        if (theme !== 'riviera' && theme !== 'porcelain' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'porcelain';
        }
        document.documentElement.dataset.rivTheme = theme;
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
