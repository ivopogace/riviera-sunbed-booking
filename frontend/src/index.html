<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Riviera</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Pre-paint theme seed: same resolution order as core/theme.ts (drift pin: theme-boot.spec.ts).
      // ThemeService stays the runtime single writer; this only pre-paints non-default themes (no FOUC).
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem('riviera-theme');
        } catch {
          // blocked storage (private mode): fall through to the OS preference
        }
        if (theme !== 'riviera' && theme !== 'porcelain' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'porcelain';
        }
        document.documentElement.dataset.rivTheme = theme;
      })();
    </script>
    <script>
      // First-visit locale redirect, before boot: same order as core/locale.ts's firstVisitLocale
      // (drift pin: locale-boot.spec.ts). Only the root build can be at "/" (ADR-0030).
      (() => {
        if (location.pathname !== '/') return;
        const supported = new Set(['en', 'sq', 'it', 'de']);
        let locale = null;
        try {
          locale = sessionStorage.getItem('riviera-sso-locale');
          sessionStorage.removeItem('riviera-sso-locale');
        } catch {
          // blocked storage: no SSO return note
        }
        try {
          if (!supported.has(locale)) locale = localStorage.getItem('riviera-locale');
        } catch {
          // blocked storage (private mode): fall through to the browser's languages
        }
        if (!supported.has(locale)) {
          const primaries = (navigator.languages || []).map((tag) =>
            tag.split('-')[0].toLowerCase(),
          );
          locale = primaries.find((primary) => supported.has(primary)) || 'en';
        }
        if (locale !== 'en') location.replace('/' + locale + '/' + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
