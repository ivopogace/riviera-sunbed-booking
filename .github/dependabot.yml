version: 2
updates:
  # Backend (Spring Boot / Gradle)
  - package-ecosystem: gradle
    directory: /platform
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Frontend (Angular / npm)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Each family pins its own members exactly as peers, so a one-package PR fails `npm ci` (ERESOLVE).
    groups:
      angular:
        patterns:
          - "@angular/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  # CI workflow actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
