name: CD

# Continuous deployment to the NON-PROD / demo environment.
#
# Gated on a green CI run on `main` (invariant for #33 AC-5: never deploy a red
# build). This is a SEPARATE workflow from CI on purpose — it keeps deploy concerns
# out of the required status checks and uses `workflow_run` so it can only start once
# the CI workflow has already concluded.
#
# Since #110 the frontend is served SAME-ORIGIN by the backend: Spring Boot bundles the
# built Angular SPA into its Docker image, so there is ONE deploy — the backend service.
# The old GitHub Pages frontend job is retired. Deploy is opt-in via the
# DEPLOY_BACKEND_RENDER repository VARIABLE so the workflow stays green as a no-op until
# the maintainer has wired the account/secret. See docs/deploy/cd-pipeline.md.

on:
  # Automatic, production path: deploy only after CI succeeds on `main`.
  # The `branches` filter scopes the trigger to CI runs whose head branch is `main`,
  # so a CI completion on any *other* branch (every feature-branch push, every PR)
  # no longer spawns a CD run that only short-circuits to "skipped" at the guard.
  # The guard's `head_branch == 'main'` check below stays as defence in depth.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual path: re-deploy the backend on demand (it now also serves the SPA — issue #110).
  workflow_dispatch:

# One deploy per branch at a time; a newer green run waits rather than racing.
concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Single decision point. For the automatic path, CI must have SUCCEEDED on `main`.
  # Manual dispatch is itself an explicit opt-in, so it passes the gate directly — from `main`
  # only, since the hook's ref= would otherwise deploy another branch's untested commit. If
  # the gate fails, the deploy job is skipped and nothing turns red.
  guard:
    name: Gate on green CI on main
    runs-on: ubuntu-latest
    # Two `echo`s. Capped anyway, so the whole workflow is covered by the ci.yml rule.
    timeout-minutes: 5
    if: >-
      ${{ (github.event_name == 'workflow_run'
            && github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.head_branch == 'main')
          || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - name: Confirm gate
        run: |
          echo "event: ${{ github.event_name }}"
          echo "Proceeding to deploy."

  backend-render:
    name: Deploy backend (serves SPA + /api) → Render
    needs: guard
    # Never runs on the temporary branch push (no secrets there); opt-in via the repo
    # variable on the automatic path, or any explicit manual dispatch.
    if: >-
      ${{ (github.event_name == 'workflow_run' && vars.DEPLOY_BACKEND_RENDER == 'true')
          || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Deliberately the loosest cap here: the live poll below is allowed ~15 min on purpose (Render's
    # free tier cold-starts), so this must clear that plus the trigger and Render's own build. It is
    # still a bound — before it, a deploy that never reported healthy could sit for six hours.
    timeout-minutes: 25
    env:
      # The commit this run deploys and then waits to see live: CI's head on the automatic path, `main`'s
      # head at dispatch on the manual one.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout the live poll (scripts/ only)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          sparse-checkout: scripts
          persist-credentials: false

      - name: Set up Node (from .nvmrc, as CI tests the poll)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # A re-run of an older green CI run, or a run main has already moved past, must not roll the service
      # back: only main's current head deploys, and the newer commit's own CD run deploys it.
      - name: Skip a commit main has moved past
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$DEPLOY_SHA" ]; then
            echo "::notice::Not deploying $DEPLOY_SHA: main is at $head, whose own CD run deploys it."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deploy of exactly this commit (Render git-builds the Docker image — SPA + jar)
        if: steps.current.outputs.superseded != 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Backend deploy requested but the RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          # ref= pins the deploy to the commit CI judged green; without it Render builds the branch head,
          # which may be a later commit, and the live poll would wait for a commit never deployed.
          case "$RENDER_DEPLOY_HOOK_URL" in *\?*) sep='&' ;; *) sep='?' ;; esac
          # --max-time: the hook returns immediately, so anything slower is a hang, not a slow deploy.
          response=$(curl -fsS --max-time 30 -X POST "${RENDER_DEPLOY_HOOK_URL}${sep}ref=${DEPLOY_SHA}")
          # Only the deploy id is echoed: the rest of the answer is Render's text, not vetted for the log.
          deploy_id=$(printf '%s' "$response" | grep -o 'dep-[a-z0-9]*' | head -n 1 || true)
          echo "Render deploy ${deploy_id:-(no deploy id in the answer)} triggered for $DEPLOY_SHA."

      - name: Wait for the new build to be live (#1632)
        if: steps.current.outputs.superseded != 'true'
        env:
          # The backend's public URL — also the app origin. Unset fails the job: an unverified deploy is not green.
          BACKEND_API_URL: ${{ vars.BACKEND_API_URL }}
          EXPECTED_SHA: ${{ env.DEPLOY_SHA }}
        # Render keeps the old instance serving until the new one passes its health check, so health alone
        # is answered by the old build: wait for /actuator/info to name this commit (docs/deploy/cd-pipeline.md).
        run: node scripts/wait-for-live-commit.mjs
