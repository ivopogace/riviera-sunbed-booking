name: Backend daily

# The backend suite on `main`, once a day, so a test whose result depends on the calendar date goes red
# within a day and not on whichever unrelated merge lands first after the date turns (#1826). `ci.yml`
# cannot do this: a pull request whose backend inputs match a green tree restores that result and runs no
# tests, and nothing runs on a day nobody merges.
#
# A separate workflow, not a `schedule` trigger on `ci.yml`, for three reasons:
# - `deploy.yml` starts on `workflow_run` of the workflow named "CI" completing on `main`. A scheduled CI run
#   would complete on `main` and deploy (or re-deploy) with no merge behind it. This workflow is named
#   differently, so that trigger never matches it.
# - `ci.yml`'s `schedule` run would also run the frontend, the a11y shards and Sonar for nothing.
# - `ci.yml` stays untouched, so the build-input key of every job in it (the file is part of the hash) and
#   every pull request's timing stay as they are.
# No job here reports a required context, and this workflow never runs on a pull request.
#
# A second pass reruns the suite with every test context's clock moved years ahead (`RIVIERA_TEST_TRAVEL_TO`,
# read by `TestClockTravel`), so a test that reads the wall for "today", or whose literal date will one day
# meet it, goes red now rather than on that date (#1842). Each pass has its own step and its own report.

on:
  schedule:
    # 23:23 UTC = 00:23 in Tirane in winter (UTC+1, CET) and 01:23 in summer (UTC+2, CEST). Cron is UTC with
    # no daylight-saving awareness, so the UTC time that is after local midnight in both seasons is the later
    # one; it is also off the top of the hour, which GitHub documents as its busiest slot.
    - cron: '23 23 * * *'
  # Start it by hand to prove the workflow without waiting a day. Reaches no deploy: see the header.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend suite (two passes)
    runs-on: ubuntu-latest
    # Both passes share this job, about 7 minutes each (about 14 for the job in the runs of 2026-11-21), so
    # 30 is no longer the margin `ci.yml`'s backend job has for its one pass. 45 is about three times a green
    # run; the job is not a required context, so the cap gates nothing. Raise it again if either pass grows
    # into it (#1861); splitting into two jobs would repeat the setup for nothing.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platform
    steps:
      # A scheduled run uses the latest commit on the default branch (GitHub's `schedule` event).
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v6

      # No cache restore: every run executes the tests. The runner's Docker runs the Testcontainers ITs.
      - name: Build and test
        id: today
        run: ./gradlew build --no-daemon

      # Uploaded before the second pass, which rewrites the same directory.
      - name: Upload the test-report XML (each test's captured stdout)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: platform/build/test-results/*/*.xml
          if-no-files-found: warn
          retention-days: 7

      # Runs even after a red first pass, so the two results can be told apart. The instant is computed
      # here so it keeps its distance from today. Twelve years puts every dated literal the suite keeps
      # on purpose (the latest is 2037) behind it, while its "far future" literals (2099) stay ahead
      # for decades. 10:00Z is daytime in Tirane in either season, clear of the midnight the run starts near.
      - name: Test with the clock 12 years ahead
        id: travel
        if: ${{ !cancelled() && steps.today.outcome != 'skipped' }}
        env:
          TRAVEL_YEARS: 12
        run: |
          export RIVIERA_TEST_TRAVEL_TO="$(date -u -d "+${TRAVEL_YEARS} years" +%Y-%m-%dT10:00:00Z)"
          echo "RIVIERA_TEST_TRAVEL_TO=${RIVIERA_TEST_TRAVEL_TO}"
          # A cleared report and --continue: both test tasks run even when the first goes red, so the
          # upload below never carries the first pass's XML as the travelled one.
          rm -rf build/test-results
          ./gradlew --continue test --rerun structuredLoggingTest --rerun --no-daemon

      - name: Upload the travelled pass's test-report XML
        if: ${{ !cancelled() && steps.travel.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results-travel
          path: platform/build/test-results/*/*.xml
          if-no-files-found: warn
          retention-days: 7
