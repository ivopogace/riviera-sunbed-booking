name: Backend daily

# The backend suite on `main`, once a day, so a test whose result depends on the calendar date goes red
# within a day and not on whichever unrelated merge lands first after the date turns (#1826). `ci.yml`
# cannot do this: a pull request whose backend inputs match a green tree restores that result and runs no
# tests, and nothing runs on a day nobody merges.
#
# A separate workflow, not a `schedule` trigger on `ci.yml`, for three reasons:
# - `deploy.yml` starts on `workflow_run` of the workflow named "CI" completing on `main`. A scheduled CI run
#   would complete on `main` and deploy (or re-deploy) with no merge behind it. This workflow is named
#   differently, so that trigger never matches it.
# - `ci.yml`'s `schedule` run would also run the frontend, the a11y shards and Sonar for nothing.
# - `ci.yml` stays untouched, so the build-input key of every job in it (the file is part of the hash) and
#   every pull request's timing stay as they are.
# No job here reports a required context, and this workflow never runs on a pull request.

on:
  schedule:
    # 23:23 UTC = 00:23 in Tirane in winter (UTC+1, CET) and 01:23 in summer (UTC+2, CEST). Cron is UTC with
    # no daylight-saving awareness, so the UTC time that is after local midnight in both seasons is the later
    # one; it is also off the top of the hour, which GitHub documents as its busiest slot.
    - cron: '23 23 * * *'
  # Start it by hand to prove the workflow without waiting a day. Reaches no deploy: see the header.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend suite (scheduled, main)
    runs-on: ubuntu-latest
    # The same cap as ci.yml's backend job, for the reason ci.yml spells out.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platform
    steps:
      # A scheduled run uses the latest commit on the default branch (GitHub's `schedule` event).
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v6

      # No cache restore: every run executes the tests. The runner's Docker runs the Testcontainers ITs.
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload the test-report XML (each test's captured stdout)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: platform/build/test-results/*/*.xml
          if-no-files-found: warn
          retention-days: 7
