name: CI

on:
  # `push` is scoped to main ON PURPOSE (#417). An unscoped `push` made every commit on a
  # PR branch fire TWO runs against the same SHA — one per event — and both published check
  # runs under the SAME names. Branch protection keys required checks by name and honours
  # only the most recent run per name, so the merge button was decided by which run finished
  # last: the push run's `sonar` job is skipped by the guard below, and a skipped job still
  # publishes a check run — instantly, the moment its `needs` clear. On #413 that zero-second
  # skip landed 10s after the PR run's real success and blocked a fully green PR.
  # Scoping push to main leaves a PR branch firing `pull_request` alone: one run per SHA, so
  # no check name has a second producer to race. Do NOT re-broaden this to all branches — the
  # duplicate-name exposure also covers the backend/frontend checks, where a transient failure
  # in the unwatched push run would block the merge. `concurrency` cannot fix this: its group
  # keys on `github.ref`, which differs between the two events (`refs/heads/*` vs
  # `refs/pull/*/merge`), so the runs never shared a group and never cancelled each other.
  # Consequence: a branch gets no CI until its PR exists — so open the PR (draft is fine) at
  # the START of implementation, and every phase push is gated. codeql.yml is scoped the same
  # way and has never had this bug.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref: consecutive pushes to a PR supersede each other
# (group `refs/pull/<n>/merge`), as do consecutive pushes to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build jacocoTestReport --no-daemon

      - name: Upload backend coverage + classes (for Sonar)
        uses: actions/upload-artifact@v7
        with:
          name: backend-sonar
          path: |
            platform/build/reports/jacoco/test/jacocoTestReport.xml
            platform/build/classes/java/main
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v7
        with:
          # .nvmrc lives at the REPO ROOT. `uses:` steps resolve paths from the repo
          # root, not the job's `working-directory: frontend`, so this is correct —
          # do NOT change it to `frontend/.nvmrc` or add one there.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (hard gate)
        run: npm run lint

      - name: Test (Vitest, once, with coverage)
        run: npm run test:coverage

      - name: Install Playwright Chromium (for the a11y e2e)
        run: npx playwright install --with-deps chromium

      - name: A11y e2e (real-render axe over the booking flow)
        # The API-mocked a11y suite — no backend needed. The real-backend U7 editor suite
        # (`npm run test:e2e`) boots Spring Boot + Postgres and is intentionally NOT run here
        # (this job has no JDK/Docker); see frontend/playwright.config.ts.
        run: npm run test:e2e:a11y

      - name: Build (production)
        run: npm run build

      - name: Upload frontend coverage (for Sonar)
        uses: actions/upload-artifact@v7
        with:
          name: frontend-sonar
          path: frontend/coverage/frontend/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonar:
    name: SonarCloud scan
    needs: [backend, frontend]
    # SonarCloud's plan analyzes the main branch and pull requests only; a push to a
    # feature branch triggers a (disallowed) branch analysis that fails with "Organization
    # is not allowed to access data from non main branches", leaving a spurious red check.
    # Since #417 the `on:` triggers above already admit only those two cases, so this guard
    # is defence in depth — it keeps a spurious branch analysis impossible if a future trigger
    # (a re-broadened `push`, a `workflow_dispatch`) reaches this job. Keep it. Note the trap
    # if you ever DO add such a trigger: this job would then be skipped on those runs, and a
    # skipped job publishes a `SonarCloud scan` check run that can mask the PR run's
    # successful one on the same SHA — the #417 bug, re-entered by the back door.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # One combined scan for the single SonarCloud project. SONAR_TOKEN is configured,
    # so the scan runs and reports the quality gate on every PR. The `SONAR_TOKEN != ''`
    # guards on the steps below are a safety fallback that keeps the job green on
    # secret-less runs (e.g. forks), not a "skipped by default" state.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for accurate Sonar new-code / blame

      - name: Download backend coverage + classes
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@v8
        with:
          name: backend-sonar
          path: platform/build

      - name: Download frontend coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@v8
        with:
          name: frontend-sonar
          path: frontend/coverage/frontend

      - name: Normalize frontend lcov paths to repo root
        if: ${{ env.SONAR_TOKEN != '' }}
        run: sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/frontend/lcov.info

      - name: SonarCloud scan (backend + frontend, single project)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
