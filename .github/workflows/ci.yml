name: CI

on:
  # Do NOT re-broaden `push` to all branches: a PR branch would then fire two runs per SHA
  # publishing the SAME check names, and branch protection honours only the last to finish —
  # so a skipped duplicate masks a real success (#417). `concurrency` cannot dedupe them;
  # the events carry different `github.ref`. Consequence: a branch has no CI until its PR
  # exists, so open the PR (draft is fine) at the start of implementation.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (consecutive pushes to one PR, or to main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job carries an explicit `timeout-minutes`, and the network-bound steps carry their own.
# GitHub's default job cap is SIX HOURS, which is not a timeout so much as an absence of one: a
# wedged download reads as "still running" for a working day, and because `sonar` needs both build
# jobs, it takes the Sonar gate down with it — the PR simply never reaches a mergeable state and
# nothing goes red to say why (incident: PR #430, `playwright install` hung ~11 min into a 4-minute
# job with lint and Vitest already green). The values below are ~4-6x the observed green durations:
# loose enough that a slow runner or a cold cache never trips them, tight enough that a hang becomes
# a fast, legible red. Raise a value if a job's real work grows into it; do not remove one.
jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    # Observed green: ~3.5 min (Gradle build + full test suite incl. Testcontainers ITs).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build jacocoTestReport --no-daemon

      - name: Upload backend coverage + classes (for Sonar)
        uses: actions/upload-artifact@v7
        with:
          name: backend-sonar
          path: |
            platform/build/reports/jacoco/test/jacocoTestReport.xml
            platform/build/classes/java/main
          if-no-files-found: error
          retention-days: 1

  frontend:
    # DO NOT RENAME. Like `Repo hygiene (diff-scoped)` below, this string is a required status-check
    # CONTEXT in the `Riviera Rule Set` ruleset (`docs/plans/ci-pipeline.md` records the list), so a
    # rename here removes a check the ruleset still expects and every pull request becomes
    # unmergeable — the #413/#420 failure. Since #615 the job also runs a hard formatting gate, so
    # the name now undersells it; that is deliberate. Correcting it means editing the ruleset in the
    # same change, which is a repository setting and not expressible in a diff (#539 records the
    # sequencing that lands the pair without an unmergeable window).
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    # Observed green: ~4 min (npm ci + lint + Vitest + Playwright install + a11y e2e + prod build).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The formatting guard below diffs against the base branch, which a depth-1 clone does
          # not contain — the same reason the repo-hygiene job fetches the full history.
          fetch-depth: 0

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v7
        with:
          # .nvmrc lives at the REPO ROOT. `uses:` steps resolve paths from the repo
          # root, not the job's `working-directory: frontend`, so this is correct —
          # do NOT change it to `frontend/.nvmrc` or add one there.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Lint (hard gate)
        run: npm run lint

      - name: Fetch the base branch (the diff-scoped guards' base)
        # NOT `github.event.pull_request.base.sha`, which is the base branch's tip when the PR was
        # opened. CI checks out the PR's MERGE ref, so once `main` moves the merge commit contains
        # commits the stale sha predates, `git merge-base` resolves to that stale sha, and the diff
        # hands this PR everything main gained meanwhile — other people's merged lines, reported as
        # yours. Caught on PR #618 the moment #617 landed mid-flight. The base branch's CURRENT tip
        # is the first parent of the merge ref, so diffing it yields exactly what this PR adds.
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}

      - name: Format (diff-scoped Prettier, hard gate)
        # Judges the lines the diff WROTE, never the files it touched: 200 of this tree's files are
        # prettier-dirty, so a file-scoped check would demand an unrelated whole-file reformat on
        # most pull requests — the trade PR #612's review refused, and the reason #615 exists.
        #
        # It lives here rather than in `Repo hygiene (diff-scoped)`, where it belongs by kind, for
        # two mechanical reasons: that job installs nothing and this guard needs the pinned Prettier
        # from frontend/node_modules, and a NEW job would report without blocking until a maintainer
        # added it to the ruleset (#534). This job is already a required context.
        #
        # Runs even when Lint failed, so one push surfaces both style gates rather than trickling
        # them over two round trips — but NOT when `npm ci` failed, where the guard would crash on a
        # missing Prettier and report a second, misleading red (`!cancelled()` excludes cancellation,
        # not failure). Pull requests only, like the other diff-scoped guards: the rule governs what
        # a diff writes, and a push to `main` has no base that means anything here.
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: node ../scripts/check-prettier-format.mjs --diff origin/${{ github.event.pull_request.base.ref }}

      - name: Test (Vitest, once, with coverage)
        run: npm run test:coverage

      - name: Install Playwright Chromium (for the a11y e2e)
        # Its own cap, well under the job's: this step is two network fetches (the browser from
        # Playwright's CDN, apt deps from Ubuntu's mirrors) and is the one that hung in #430. A step
        # timeout names the culprit in the failed step rather than killing the job at some later
        # point, and leaves the job's remaining budget for the work that follows.
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium

      - name: A11y e2e (real-render axe over the booking flow)
        # The API-mocked a11y suite — no backend needed. The real-backend U7 editor suite
        # (`npm run test:e2e`) boots Spring Boot + Postgres and is intentionally NOT run here
        # (this job has no JDK/Docker); see frontend/playwright.config.ts.
        run: npm run test:e2e:a11y

      - name: Build (production)
        run: npm run build

      - name: Upload frontend coverage (for Sonar)
        uses: actions/upload-artifact@v7
        with:
          name: frontend-sonar
          path: frontend/coverage/frontend/lcov.info
          if-no-files-found: error
          retention-days: 1

  repo-hygiene:
    # DO NOT RENAME. This string is a required status-check CONTEXT in the `Riviera Rule Set`
    # ruleset (#534 added the seventh context as `Inline comments (RV-STYLE-1)`; #539 renamed it
    # to this string; `docs/plans/ci-pipeline.md` records the list). A ruleset names its contexts
    # explicitly, so renaming the job here removes a check the ruleset still expects, and EVERY
    # pull request becomes unmergeable — the `405 … N of N required status checks are expected`
    # failure #413/#420 already paid for once. Renaming means editing the ruleset in the same
    # change, which is a repository setting and not expressible in a diff — #539 records the
    # swap sequencing that lands the pair without an unmergeable window.
    name: Repo hygiene (diff-scoped)
    # Three diff-scoped repo-hygiene guards, not one: RV-STYLE-1 inline comments (#529), the plan
    # doc's File-structure section (#533), and the two stranded-focus postures (#621). They share
    # this job because they share a shape — judge what a DIFF wrote, never the standing tree — and
    # because the name above is the enforcement handle. Until #539 the job kept #529's original
    # name, which described only the first guard; a plan-doc failure surfacing under "Inline
    # comments" sent the author hunting the wrong rule.
    #
    # The authoring-time guard's backstop (#529). The hook in .claude/settings.json is the
    # primary control — it fires on the edit itself — but hooks are per-machine and an author
    # can disable them, so the rule also has to hold somewhere the merge gate can read. The #533
    # guard has no hook half: its rule needs the whole diff, and mid-slice a plan doc legitimately
    # lags the code it plans, so a per-edit check would fire on nearly every edit.
    #
    # Pull requests only, deliberately. The rule governs what a DIFF writes, and a push to main
    # has no base to diff against that means anything here (the tree carries many pre-existing
    # multi-line inline comments by design; see the guard's header).
    #
    # Same #417 trap as the sonar job below, and for the same reason: when this `if` is false the
    # job is SKIPPED, and a skipped job still publishes a check run under this name. What makes
    # that harmless today is not the `if` — it is that `push` is scoped to `branches: [main]`, so
    # a push run and a PR run never share a head SHA, and masking needs a same-SHA collision.
    # Broaden the `push` trigger and this job masks its own PR result exactly as #417 described.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Observed green: well under a minute (no install step — the guards have no dependencies).
    #
    # That is a constraint, not just a fact: `scripts/*.test.mjs` runs HERE, so nothing a guard
    # module imports may reach `node_modules`. The Prettier guard (#615) obeys it by resolving
    # Prettier lazily, inside the function that formats — hence its own check running in the
    # frontend job instead, which is where `npm ci` has already run.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The guard diffs against the PR's base commit, which a depth-1 clone does not contain.
          fetch-depth: 0

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Fetch the base branch (the diff-scoped guards' base)
        # NOT `github.event.pull_request.base.sha`, which is the base branch's tip when the PR was
        # opened. CI checks out the PR's MERGE ref, so once `main` moves the merge commit contains
        # commits the stale sha predates, `git merge-base` resolves to that stale sha, and the diff
        # hands this PR everything main gained meanwhile — other people's merged lines, reported as
        # yours. Caught on PR #618 the moment #617 landed mid-flight. The base branch's CURRENT tip
        # is the first parent of the merge ref, so diffing it yields exactly what this PR adds.
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}

      - name: Test the guards themselves
        # Globs both suites; a new scripts/*.test.mjs is picked up with no edit here.
        run: node --test "scripts/*.test.mjs"

      - name: Check the diff for multi-line inline comments (RV-STYLE-1, hard gate)
        run: node scripts/check-inline-comments.mjs --diff origin/${{ github.event.pull_request.base.ref }}

      - name: Check each plan doc lists what the diff changed (#533, hard gate)
        # Runs even when the step above failed, so one push surfaces both rules rather than
        # trickling them out over two round trips — each is a seconds-long fix on its own.
        if: ${{ !cancelled() }}
        run: node scripts/check-plan-file-structure.mjs --diff origin/${{ github.event.pull_request.base.ref }}

      - name: Check the diff for stranded-focus postures (#621, hard gate)
        # The CI half of the authoring-time hook, same as the RV-STYLE-1 guard above: BUSY-1 (a
        # control disabled by its own in-flight flag) and FOCUS-1 (a confirm surface with no focus
        # leg). Both are diff-scoped — ~12 legitimate `[disabled]` bindings stand in the tree by
        # design, so a repo-wide gate would go red on day one. `--all` sweeps them for an audit.
        if: ${{ !cancelled() }}
        run: node scripts/check-focus-posture.mjs --diff origin/${{ github.event.pull_request.base.ref }}

  sonar:
    name: SonarCloud scan
    needs: [backend, frontend]
    # SonarCloud's plan analyzes the main branch and pull requests only; a push to a
    # feature branch triggers a (disallowed) branch analysis that fails with "Organization
    # is not allowed to access data from non main branches", leaving a spurious red check.
    # Since #417 the triggers above admit only those two cases, so this guard is defence in
    # depth — keep it. Trap if you ever add a trigger that reaches this job: it would be
    # SKIPPED there, and a skipped job still publishes a `SonarCloud scan` check run that can
    # mask the PR run's successful one on the same SHA (#417, by the back door).
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Observed green: ~1 min (artifact downloads + the scanner). Its own cap matters as much as the
    # build jobs': this is the job the merge gate reads, so a hang here is indistinguishable from
    # "analysis pending" and blocks the Sonar gate silently.
    timeout-minutes: 15
    # One combined scan for the single SonarCloud project. SONAR_TOKEN is configured,
    # so the scan runs and reports the quality gate on every PR. The `SONAR_TOKEN != ''`
    # guards on the steps below are a safety fallback that keeps the job green on
    # secret-less runs (e.g. forks), not a "skipped by default" state.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for accurate Sonar new-code / blame

      - name: Download backend coverage + classes
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@v8
        with:
          name: backend-sonar
          path: platform/build

      - name: Download frontend coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@v8
        with:
          name: frontend-sonar
          path: frontend/coverage/frontend

      - name: Normalize frontend lcov paths to repo root
        if: ${{ env.SONAR_TOKEN != '' }}
        run: sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/frontend/lcov.info

      - name: SonarCloud scan (backend + frontend, single project)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
