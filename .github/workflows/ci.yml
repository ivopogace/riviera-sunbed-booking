name: CI

# Four job names are required status-check contexts in the `Riviera Rule Set` (CONTRIBUTING.md lists
# the seven): `Backend (build + test)`, `Frontend (lint + test + build)`, `Repo hygiene (diff-scoped)`
# and `SonarCloud scan`'s `SonarCloud Code Analysis`. Renaming one, or letting a path filter or a
# job-level `if` skip it, leaves the PR waiting on a check that never reports (#413/#420/#539/#955).
on:
  # `main` only: a wider `push` fires two runs per PR SHA under the same check names, and the ruleset
  # honours whichever finishes last (#417). A branch therefore has no CI until its PR exists.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job and every network-bound step carries a `timeout-minutes` of roughly five times a green
# run; GitHub's six-hour default let a hung download block the merge gate for a day (#430).
#
# `backend`, `frontend` and the `a11y-e2e` shards skip their build on a `pull_request` whose inputs
# hash to a key an earlier green run saved (#955). The hash, not a path list, is the change detector:
# the one spec that reads outside `frontend/` is in the key. A push to `main` always builds and seeds
# the cache. The key is computed right after checkout, before any build output exists to hash.
jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute the build-input hash (the cache key)
        id: key
        # `hashFiles` resolves from the repo root, not `working-directory`.
        run: echo "key=v2-backend-sonar-${{ hashFiles('platform/**', '!platform/build/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Sonar inputs of an identical, already-green tree (pull requests only)
        id: restore
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: |
            platform/build/reports/jacoco/test/jacocoTestReport.xml
            platform/build/classes/java/main
            platform/build/spring-modulith-docs
          key: ${{ steps.key.outputs.key }}

      - name: Set up JDK 25
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (cached)
        if: steps.restore.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        if: steps.restore.outputs.cache-hit != 'true'
        run: ./gradlew build jacocoTestReport --no-daemon

      - name: Save the Sonar inputs for the next push of this tree
        # Reached only through a green build, so a hit can only restore what once passed.
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            platform/build/reports/jacoco/test/jacocoTestReport.xml
            platform/build/classes/java/main
            platform/build/spring-modulith-docs
          key: ${{ steps.key.outputs.key }}

      - name: Upload backend coverage + classes (for Sonar)
        # `if-no-files-found: error` turns an empty restore into a red here, not in `sonar`.
        uses: actions/upload-artifact@v7
        with:
          name: backend-sonar
          path: |
            platform/build/reports/jacoco/test/jacocoTestReport.xml
            platform/build/classes/java/main
          if-no-files-found: error
          retention-days: 1

      - name: Upload the Spring Modulith docs (module diagrams + canvases)
        uses: actions/upload-artifact@v7
        with:
          name: modulith-docs
          path: platform/build/spring-modulith-docs
          if-no-files-found: error
          retention-days: 30

  a11y-e2e:
    # The API-mocked a11y Playwright suite over three runners (#1597). Not a required context: it
    # blocks merge through `frontend`'s `needs` and its "every shard green" step. Change `shard` and
    # `total` together.
    name: A11y e2e (shard ${{ matrix.shard }} of ${{ matrix.total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
    outputs:
      key: ${{ steps.key.outputs.key }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute the build-input hash (the cache key)
        id: key
        # Byte-for-byte `frontend`'s expression; that job fails when the two disagree.
        run: echo "key=v1-frontend-sonar-${{ hashFiles('frontend/**', '.nvmrc', 'docs/design/non-text-contrast.md', '!frontend/node_modules/**', '!frontend/coverage/**', '!frontend/dist/**', '!frontend/.angular/**') }}" >> "$GITHUB_OUTPUT"

      - name: Look up whether an identical tree already passed the whole frontend gate (pull requests only)
        id: restore
        # `frontend` saves this key only after every gate, this suite included. The `path` list is
        # part of the entry's identity, so it must match that save exactly or the lookup never hits.
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: |
            frontend/coverage/frontend/lcov.info
            frontend/coverage/eslint-rules/lcov.info
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Set up Node (from .nvmrc)
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.restore.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium

      - name: A11y e2e (real-render axe over the booking flow), this shard
        # The real-backend suite (`npm run test:e2e`) needs a JDK and Docker and is not run in CI.
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm run test:e2e:a11y -- --shard=${{ matrix.shard }}/${{ matrix.total }}

  frontend:
    name: Frontend (lint + test + build)
    # `!cancelled()` runs this job after a red shard so its last step fails it under the required
    # name, instead of a `skipped` the ruleset might read as passing (#955, #1597).
    needs: [a11y-e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute the build-input hash (the cache key)
        id: key
        # Everything this job and the a11y shards read, by mechanism: `setup-node` reads the root
        # `.nvmrc`; `focus-ring-baseline.spec.ts` reads the design doc. A spec that starts reading
        # outside `frontend/` joins this list, or a hit is a wrong green.
        run: echo "key=v1-frontend-sonar-${{ hashFiles('frontend/**', '.nvmrc', 'docs/design/non-text-contrast.md', '!frontend/node_modules/**', '!frontend/coverage/**', '!frontend/dist/**', '!frontend/.angular/**') }}" >> "$GITHUB_OUTPUT"

      - name: Check the a11y shards hashed the same tree (the two key expressions have not drifted)
        if: ${{ needs.a11y-e2e.result == 'success' && needs.a11y-e2e.outputs.key != steps.key.outputs.key }}
        run: |
          echo "::error::a11y-e2e computed '${{ needs.a11y-e2e.outputs.key }}' but this job computed '${{ steps.key.outputs.key }}': align the two hashFiles expressions in ci.yml"
          exit 1

      - name: Restore the Sonar inputs of an identical, already-green tree (pull requests only)
        id: restore
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: |
            frontend/coverage/frontend/lcov.info
            frontend/coverage/eslint-rules/lcov.info
          key: ${{ steps.key.outputs.key }}

      - name: Set up Node (from .nvmrc)
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          # `uses:` paths resolve from the repo root, where `.nvmrc` lives.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint (hard gate)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm run lint

      - name: Test the lint rules themselves (with coverage, for Sonar)
        # Here, not in `repo-hygiene`, because it drives ESLint and that job installs nothing. The
        # sed makes the SF paths repo-relative, like the frontend lcov's below.
        if: steps.restore.outputs.cache-hit != 'true'
        run: >-
          mkdir -p coverage/eslint-rules &&
          node --test --experimental-test-coverage
          --test-coverage-include='eslint-rules/**' --test-coverage-exclude='eslint-rules/*.test.mjs'
          --test-reporter=lcov --test-reporter-destination=coverage/eslint-rules/lcov.info
          --test-reporter=spec --test-reporter-destination=stdout
          "eslint-rules/*.test.mjs" &&
          sed -i 's#^SF:eslint-rules/#SF:frontend/eslint-rules/#' coverage/eslint-rules/lcov.info

      - name: Format (Prettier, hard gate)
        # Runs after a red Lint so one push surfaces both, but not after a failed or skipped install,
        # where it would crash on a missing Prettier or re-check a tree a cache hit already passed.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx prettier --check src e2e eslint-rules

      - name: Test (Vitest, once, with coverage)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm run test:coverage

      - name: Build (production)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm run build

      - name: Require every a11y shard green
        # After this job's own gates so one push surfaces every red. Skipped shards report `success`.
        if: ${{ !cancelled() && needs.a11y-e2e.result != 'success' }}
        run: |
          echo "::error::the a11y e2e shards ended '${{ needs.a11y-e2e.result }}'; see the A11y e2e (shard k of N) jobs"
          exit 1

      - name: Save the Sonar inputs for the next push of this tree
        # Reached only through a green run of every gate above, the shards included.
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            frontend/coverage/frontend/lcov.info
            frontend/coverage/eslint-rules/lcov.info
          key: ${{ steps.key.outputs.key }}

      - name: Upload frontend coverage (for Sonar)
        uses: actions/upload-artifact@v7
        with:
          name: frontend-sonar
          # Two paths, so the artifact root is `frontend/coverage`; `sonar` downloads to match.
          path: |
            frontend/coverage/frontend/lcov.info
            frontend/coverage/eslint-rules/lcov.info
          if-no-files-found: error
          retention-days: 1

  repo-hygiene:
    name: Repo hygiene (diff-scoped)
    # The guards judge what a DIFF wrote (each `scripts/check-*.mjs` header says what and why), so a
    # push to `main` has no base. Skipping is safe only while `push` is `main`-only (#417).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Fetch the base branch (the diff-scoped guards' base)
        # The base branch's CURRENT tip, not `base.sha`: once `main` moves under the PR, diffing the
        # stale sha reports other people's merged lines as this PR's (#618).
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}

      - name: Test the guards themselves
        # No install step: nothing a guard imports may reach `node_modules`.
        run: node --test "scripts/*.test.mjs"

      - name: Check the diff's comments and skill prose (RV-STYLE-1, hard gate)
        run: node scripts/check-inline-comments.mjs --diff origin/${{ github.event.pull_request.base.ref }}

      - name: Check doc comments and RESPONSIBILITIES.md over budget did not grow (§6d ratchet, hard gate)
        if: ${{ !cancelled() }}
        run: node scripts/check-doc-budget.mjs

      - name: Check the diff for stranded-focus postures (#621, BUSY-1 gates)
        if: ${{ !cancelled() }}
        run: node scripts/check-focus-posture.mjs --diff origin/${{ github.event.pull_request.base.ref }}

      - name: Check the diff declares its touch targets (#648, both rules gate)
        if: ${{ !cancelled() }}
        run: node scripts/check-touch-target.mjs --diff origin/${{ github.event.pull_request.base.ref }}

      - name: Check the cloud setup script's Node pin still matches .nvmrc (#659, hard gate)
        if: ${{ !cancelled() }}
        run: node scripts/check-cloud-node-pin.mjs

      - name: Check no text file is stored CRLF in the index (#1510, hard gate)
        # An API commit (Dependabot's wrapper bump) skips normalization; `attr/-text` rows are binaries.
        if: ${{ !cancelled() }}
        run: |
          bad=$(git ls-files --eol | awk '$1 ~ /^i\/(crlf|mixed)$/ && $3 != "attr/-text"')
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Text file(s) stored CRLF in the index. Fix: git add --renormalize <path> && git commit"
            exit 1
          fi

  sonar:
    name: SonarCloud scan
    needs: [backend, frontend]
    # SonarCloud's plan analyses `main` and pull requests only; any other ref fails the scan. Keep
    # the guard even though the triggers already admit only those two (#417).
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Runs on every push, cache hit or not: the `SonarCloud Code Analysis` context exists for a SHA
    # only when an analysis is uploaded for it (#955).
    timeout-minutes: 15
    # The `SONAR_TOKEN != ''` guards keep secret-less runs (forks) green; the token is configured.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download backend coverage + classes
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@v8
        with:
          name: backend-sonar
          path: platform/build

      - name: Download frontend coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@v8
        with:
          name: frontend-sonar
          path: frontend/coverage

      - name: Normalize frontend lcov paths to repo root
        if: ${{ env.SONAR_TOKEN != '' }}
        run: sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/frontend/lcov.info

      - name: Set up Node (from .nvmrc)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Run the guard suites with coverage (the scripts/ lcov for Sonar)
        # `scripts/` is in `sonar.sources`. Run here, not handed off from `repo-hygiene`: that job is
        # `pull_request`-only, and a `needs:` on it would skip this job on `main`.
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >-
          mkdir -p scripts/coverage &&
          node --test --experimental-test-coverage
          --test-coverage-include='scripts/**' --test-coverage-exclude='scripts/*.test.mjs'
          --test-reporter=lcov --test-reporter-destination=scripts/coverage/lcov.info
          --test-reporter=spec --test-reporter-destination=stdout
          "scripts/*.test.mjs"

      - name: SonarCloud scan (backend + frontend + scripts, single project)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
