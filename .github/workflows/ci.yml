name: CI

# The job names marked "Required context" below are status-check contexts the `Riviera Rule Set`
# requires by exact string (CONTRIBUTING.md lists them all, with `SonarCloud Code Analysis`, which the
# SonarCloud app posts). Renaming one, or letting a path filter skip its workflow, leaves the PR waiting
# on a check that never reports (#413/#420/#539); a job-level `if` that skips one on a pull request
# posts `skipped`, and whether the ruleset reads that as passing is a bet not taken (#955; the `if`s
# on `repo-hygiene` and `sonar` hold on every pull request). A context joins the ruleset only after the
# job reporting it is on `main` (`A11y e2e (all shards)`, #1600): required first, it would hold every
# open PR on a check its head never reports (#534/#539).
on:
  # `main` only: a wider `push` fires two runs per PR SHA under the same check names, and the ruleset
  # honours whichever finishes last (#417). A branch therefore has no CI until its PR exists.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job carries a `timeout-minutes`, well above a green run, because GitHub's six-hour default let
# a hung download block the merge gate for a day (#430); the download that hung carries its own. Raise
# a value if a job's real work grows into it; do not remove one.
#
# `backend`, `frontend` and the `a11y-e2e` shards skip their build on a `pull_request` whose inputs
# hash to a key an earlier green run saved (#955). The hash, not a path list, is the change detector,
# so every file a job's build or tests read is in its key, including the ones outside its folder. A
# push to `main` always builds and seeds the cache. The key is computed right after checkout, before
# any build output exists to hash. Every key also hashes this file, so any edit here re-runs all three
# on its own PR rather than certifying steps that never ran (#1649); no prefix bump is needed to force
# a run.
jobs:
  backend:
    name: Backend (build + test) # Required context (header above): do not rename.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute the build-input hash (the cache key)
        id: key
        # `hashFiles` resolves from the repo root, not `working-directory`.
        run: echo "key=backend-sonar-${{ hashFiles('platform/**', '.github/workflows/ci.yml', '!platform/build/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Sonar inputs of an identical, already-green tree (pull requests only)
        id: restore
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: |
            platform/build/reports/jacoco/test/jacocoTestReport.xml
            platform/build/classes/java/main
            platform/build/spring-modulith-docs
          key: ${{ steps.key.outputs.key }}

      - name: Set up JDK 25
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (cached)
        if: steps.restore.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        if: steps.restore.outputs.cache-hit != 'true'
        run: ./gradlew build jacocoTestReport --no-daemon

      - name: Save the Sonar inputs for the next push of this tree
        # Reached only through a green build, so a hit can only restore what once passed.
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            platform/build/reports/jacoco/test/jacocoTestReport.xml
            platform/build/classes/java/main
            platform/build/spring-modulith-docs
          key: ${{ steps.key.outputs.key }}

      - name: Upload backend coverage + classes (for Sonar)
        # `if-no-files-found: error` turns an empty restore into a red here, not in `sonar`.
        uses: actions/upload-artifact@v7
        with:
          name: backend-sonar
          path: |
            platform/build/reports/jacoco/test/jacocoTestReport.xml
            platform/build/classes/java/main
          if-no-files-found: error
          retention-days: 1

      - name: Upload the Spring Modulith docs (module diagrams + canvases)
        uses: actions/upload-artifact@v7
        with:
          name: modulith-docs
          path: platform/build/spring-modulith-docs
          if-no-files-found: error
          retention-days: 30

  a11y-e2e:
    # The API-mocked a11y Playwright suite over the runners `matrix.shard` lists (#1597). Not a
    # required context: it blocks merge through `a11y-e2e-gate`, which fails unless every shard passed.
    name: A11y e2e (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    outputs:
      # `a11y-e2e-gate` saves the marker under this key, so the cache's identity has one source.
      key: ${{ steps.key.outputs.key }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute the build-input hash (the suite's cache key)
        id: key
        # The same `hashFiles` arguments as `frontend`'s key step, whose comment lists what is read
        # outside `frontend/`; a file joins or leaves both lists together.
        run: echo "key=a11y-e2e-${{ hashFiles('frontend/**', '.nvmrc', '.github/workflows/ci.yml', 'docs/design/non-text-contrast.md', 'platform/map/**', '!frontend/node_modules/**', '!frontend/coverage/**', '!frontend/dist/**', '!frontend/.angular/**') }}" >> "$GITHUB_OUTPUT"

      - name: Look up whether an identical tree already passed every shard (pull requests only)
        id: restore
        # `a11y-e2e-gate` saves this key only after every shard passed. The `path` list is part of the
        # entry's identity, so it must match that save exactly or the lookup never hits.
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: a11y-e2e-passed
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Set up Node (from .nvmrc)
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm ci

      - name: List the system packages Chromium needs that the image lacks
        # Not `--with-deps`: its `apt-get install` also upgrades libraries the image already ships, and a
        # slow apt mirror timed that step out (#1629). Playwright's dry run (`apt-get install -s`, no
        # download) lists what apt would touch; dpkg drops what is installed. On `ubuntu24` the rest is
        # fonts, which the next step caches as .debs. No list from a failed dry run: full `install-deps`.
        id: deps
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          missing=
          if ! report=$(npx playwright install-deps --dry-run chromium 2>&1); then
            echo "$report"
            listed=$(printf '%s\n' "$report" | sed -n 's/^  \([^ ]\+\)$/\1/p')
            if [ -z "$listed" ]; then
              echo "fallback=true" >> "$GITHUB_OUTPUT"
            fi
            missing=$(for pkg in $listed; do
              dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q 'ok installed' || echo "$pkg"
            done | sort | xargs)
          fi
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          # The installed Playwright, not a literal, so a bump busts the cache; the package set, so an
          # image that ships more or fewer of them does too.
          echo "key=playwright-${ImageOS}-$(node -p "require('playwright-core/package.json').version")-$(echo "$missing" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers and system-package .debs (saved at job end on a miss)
        id: browsers
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: ${{ steps.deps.outputs.key }}

      - name: Install Playwright Chromium
        # A hit touches no network but the cache: the browsers are in place and the .debs install
        # offline. A miss downloads the browsers from Playwright's CDN and the .debs from apt once. The
        # fallback alone goes to apt on every run, hit or not.
        if: steps.restore.outputs.cache-hit != 'true'
        timeout-minutes: 6
        env:
          MISSING: ${{ steps.deps.outputs.missing }}
          FALLBACK: ${{ steps.deps.outputs.fallback }}
          HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          npx playwright install chromium
          if [ "$FALLBACK" = true ]; then
            npx playwright install-deps chromium
            exit 0
          fi
          [ -n "$MISSING" ] || exit 0
          debs=~/.cache/playwright-debs
          if [ "$HIT" != true ]; then
            mkdir -p "$debs/partial"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends --download-only -o Dir::Cache::archives="$debs" $MISSING
            sudo rm -rf "$debs/partial" "$debs/lock"
            sudo chown -R "$(id -u):$(id -g)" "$debs"
          fi
          sudo dpkg -i "$debs"/*.deb

      - name: A11y e2e (real-render axe over the booking flow), this shard
        # The real-backend suite (`npm run test:e2e`) needs a JDK and Docker and is not run in CI.
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm run test:e2e:a11y -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  a11y-e2e-gate:
    name: A11y e2e (all shards) # Required context (header above): do not rename.
    # `!cancelled()` runs this job after a red shard so it fails under the required name, instead of a
    # `skipped` the ruleset might read as passing (#955, #1597).
    needs: [a11y-e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every a11y shard green
        # On a cache hit the shards skip their steps and still end `success`.
        if: ${{ needs.a11y-e2e.result != 'success' }}
        run: |
          echo "::error::the a11y e2e shards ended '${{ needs.a11y-e2e.result }}'; see the A11y e2e (shard k of N) jobs"
          exit 1

      - name: Write the marker the shards look up
        # The shards' key, not a hash of its own: this job checks nothing out. Empty only if no shard
        # reached its key step, which a green matrix rules out; fail here rather than save under no key.
        id: key
        env:
          KEY: ${{ needs.a11y-e2e.outputs.key }}
        run: |
          test -n "$KEY" || { echo "::error::a11y-e2e produced no cache key"; exit 1; }
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SHA" > a11y-e2e-passed

      - name: Save the marker for the next push of this tree
        # Reached only through a green matrix, so a hit can only certify a tree every shard passed.
        uses: actions/cache/save@v6
        with:
          path: a11y-e2e-passed
          key: ${{ steps.key.outputs.key }}

  frontend:
    name: Frontend (lint + test + build) # Required context (header above): do not rename.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute the build-input hash (the cache key)
        id: key
        # What this job and the `a11y-e2e` shards read outside `frontend/`, besides this file (header):
        # `setup-node` reads the root `.nvmrc`, `focus-ring-baseline.spec.ts` the design doc,
        # `map-water.spec.ts` and the e2e `support/map-resources.ts` the map style, sprites and glyphs.
        # A spec that starts reading elsewhere joins this list, or a hit is a wrong green. The shards
        # hash the same arguments under their own prefix; a file joins or leaves both lists together.
        run: echo "key=frontend-sonar-${{ hashFiles('frontend/**', '.nvmrc', '.github/workflows/ci.yml', 'docs/design/non-text-contrast.md', 'platform/map/**', '!frontend/node_modules/**', '!frontend/coverage/**', '!frontend/dist/**', '!frontend/.angular/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Sonar inputs of an identical, already-green tree (pull requests only)
        id: restore
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: |
            frontend/coverage/frontend/lcov.info
            frontend/coverage/eslint-rules/lcov.info
          key: ${{ steps.key.outputs.key }}

      - name: Set up Node (from .nvmrc)
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          # `uses:` paths resolve from the repo root, where `.nvmrc` lives.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint (hard gate)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm run lint

      - name: Test the lint rules themselves (with coverage, for Sonar)
        # Here, not in `repo-hygiene`, because it drives ESLint and that job installs nothing. The
        # sed makes the SF paths repo-relative, like the frontend lcov's below.
        if: steps.restore.outputs.cache-hit != 'true'
        run: >-
          mkdir -p coverage/eslint-rules &&
          node --test --experimental-test-coverage
          --test-coverage-include='eslint-rules/**' --test-coverage-exclude='eslint-rules/*.test.mjs'
          --test-reporter=lcov --test-reporter-destination=coverage/eslint-rules/lcov.info
          --test-reporter=spec --test-reporter-destination=stdout
          "eslint-rules/*.test.mjs" &&
          sed -i 's#^SF:eslint-rules/#SF:frontend/eslint-rules/#' coverage/eslint-rules/lcov.info

      - name: Format (Prettier, hard gate)
        # Runs after a red Lint so one push surfaces both, but not after a failed or skipped install,
        # where it would crash on a missing Prettier or re-check a tree a cache hit already passed.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx prettier --check src e2e eslint-rules

      - name: Typecheck the e2e specs (hard gate)
        # Playwright transpiles the specs without checking them, so only this catches a fixture
        # drifting from its wire type. Gated like Format, so a red Lint still surfaces it.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck:e2e

      - name: Test (Vitest, once, with coverage)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm run test:coverage

      - name: Build (production)
        if: steps.restore.outputs.cache-hit != 'true'
        run: npm run build

      - name: Save the Sonar inputs for the next push of this tree
        # Reached only through a green run of every gate above.
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            frontend/coverage/frontend/lcov.info
            frontend/coverage/eslint-rules/lcov.info
          key: ${{ steps.key.outputs.key }}

      - name: Upload frontend coverage (for Sonar)
        uses: actions/upload-artifact@v7
        with:
          name: frontend-sonar
          # Two paths, so the artifact root is `frontend/coverage`; `sonar` downloads to match.
          path: |
            frontend/coverage/frontend/lcov.info
            frontend/coverage/eslint-rules/lcov.info
          if-no-files-found: error
          retention-days: 1

  repo-hygiene:
    name: Repo hygiene (diff-scoped) # Required context (header above): do not rename.
    # The `--diff` guards judge what a DIFF wrote (each `scripts/check-*.mjs` header says what and
    # why), so a push to `main` has no base; the standing-tree checks ride along under this name.
    # Skipping is safe only while `push` is `main`-only (#417).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Fetch the base branch (the diff-scoped guards' base)
        # The base branch's CURRENT tip, not `base.sha`: once `main` moves under the PR, diffing the
        # stale sha reports other people's merged lines as this PR's (#618).
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.ref }}

      - name: Test the guards themselves
        # No install step: nothing a guard imports may reach `node_modules`.
        run: node --test "scripts/*.test.mjs"

      - name: Check the diff's comments and skill prose (RV-STYLE-1, hard gate)
        run: node scripts/check-inline-comments.mjs --diff origin/${{ github.event.pull_request.base.ref }}

      - name: Check doc comments and RESPONSIBILITIES.md over budget did not grow (§6d ratchet, hard gate)
        if: ${{ !cancelled() }}
        run: node scripts/check-doc-budget.mjs

      - name: Check the diff for stranded-focus postures (#621, BUSY-1 gates)
        if: ${{ !cancelled() }}
        run: node scripts/check-focus-posture.mjs --diff origin/${{ github.event.pull_request.base.ref }}

      - name: Check the diff declares its touch targets (#648, both rules gate)
        if: ${{ !cancelled() }}
        run: node scripts/check-touch-target.mjs --diff origin/${{ github.event.pull_request.base.ref }}

      - name: Check the cloud setup script's Node pin still matches .nvmrc (#659, hard gate)
        if: ${{ !cancelled() }}
        run: node scripts/check-cloud-node-pin.mjs

      - name: Check no text file is stored CRLF in the index (#1510, hard gate)
        # An API commit (Dependabot's wrapper bump) skips normalization; `attr/-text` rows are binaries.
        if: ${{ !cancelled() }}
        run: |
          bad=$(git ls-files --eol | awk '$1 ~ /^i\/(crlf|mixed)$/ && $3 != "attr/-text"')
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Text file(s) stored CRLF in the index. Fix: git add --renormalize <path> && git commit"
            exit 1
          fi

  sonar:
    name: SonarCloud scan
    needs: [backend, frontend]
    # SonarCloud's plan analyses `main` and pull requests only; any other ref fails the scan. Keep
    # the guard even though the triggers already admit only those two (#417).
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Runs on every push, cache hit or not: the `SonarCloud Code Analysis` context exists for a SHA
    # only when an analysis is uploaded for it (#955).
    timeout-minutes: 15
    # The `SONAR_TOKEN != ''` guards keep secret-less runs (forks) green; the token is configured.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download backend coverage + classes
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@v8
        with:
          name: backend-sonar
          path: platform/build

      - name: Download frontend coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@v8
        with:
          name: frontend-sonar
          path: frontend/coverage

      - name: Normalize frontend lcov paths to repo root
        if: ${{ env.SONAR_TOKEN != '' }}
        run: sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/frontend/lcov.info

      - name: Set up Node (from .nvmrc)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Run the guard suites with coverage (the scripts/ lcov for Sonar)
        # `scripts/` is in `sonar.sources`. Run here, not handed off from `repo-hygiene`: that job is
        # `pull_request`-only, and a `needs:` on it would skip this job on `main`.
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >-
          mkdir -p scripts/coverage &&
          node --test --experimental-test-coverage
          --test-coverage-include='scripts/**' --test-coverage-exclude='scripts/*.test.mjs'
          --test-reporter=lcov --test-reporter-destination=scripts/coverage/lcov.info
          --test-reporter=spec --test-reporter-destination=stdout
          "scripts/*.test.mjs"

      - name: SonarCloud scan (backend + frontend + scripts, single project)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
